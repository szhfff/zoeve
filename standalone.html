        // 通用表格导出 Excel（实际为 CSV，Excel 可直接打开）
        function exportTableToExcel(tableEl, fileName) {
            if (!tableEl) return;
            const rows = [];
            const thead = tableEl.querySelector('thead tr');
            if (thead) {
                rows.push(Array.from(thead.querySelectorAll('th')).map(th => th.textContent.trim()));
            }
            tableEl.querySelectorAll('tbody tr').forEach(tr => {
                rows.push(Array.from(tr.querySelectorAll('td')).map(td => td.textContent.trim()));
            });
            const tfoot = tableEl.querySelector('tfoot tr');
            if (tfoot) {
                rows.push(Array.from(tfoot.querySelectorAll('td')).map(td => td.textContent.trim()));
            }
            const csv = rows.map(r => r.map(cell => {
                const c = String(cell || '').replace(/"/g, '""');
                return /[",\n]/.test(c) ? `"${c}"` : c;
            }).join(',')).join('\n');
            // 加 BOM 头确保 Excel 正确识别 UTF-8
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${fileName}_${new Date().toISOString().slice(0, 10)}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function exportCustomerReport() {
            const table = document.querySelector('#cr-result table');
            if (!table) { alert('请先查询数据'); return; }

                const cust = (data.customers || []).find(c => c.id == o.customer_id);
                const custName = cust ? (cust.short_name || cust.company_name) : '—';
                const sec = o.secondary_customer || '';
                const t = ordTime(o);
                const items = (data.washOrderItems || []).filter(it => it.order_id == o.id);
                const itemCount = items.length;
                const totalAmount = items.reduce((s, it) => s + (it.total_price || 0), 0);
                const hasNoPrice = items.some(it => it.price_source === 'none' || !it.unit_price);
                const active = (o.id === orderReportCurrentId) ? ' active' : '';
                return `<tr class="or-row${active}" data-oid="${o.id}" onclick="selectOrderReport(${o.id})">
                    <td>${o.order_no || ''}</td>
                    <td>${custName}</td>
                    <td>${sec || '<span style="color:#999;">—</span>'}</td>
                    <td>${statusText(o.status)}</td>
                    <td>${t || ''}</td>
                    <td>${itemCount}</td>
                    <td style="text-align:right;${hasNoPrice ? 'color:#d9534f;' : ''}">¥${totalAmount.toFixed(2)}${hasNoPrice ? ' ⚠' : ''}</td>
                    <td>${o.note || ''}</td>
                </tr>`;
            }).join('');
            return `<table class="or-table"><thead><tr>
                <th>订单号</th><th>客户</th><th>二级客户</th><th>状态</th><th>时间</th><th>明细数</th><th>金额</th><th>备注</th>
            </tr></thead><tbody>${rows}</tbody></table>`;
        }

        function selectOrderReport(orderId) {
            orderReportCurrentId = orderId;
            // 仅更新选中态，保留上半部滚动位置
            document.querySelectorAll('.or-row').forEach(r => r.classList.toggle('active', r.dataset.oid == orderId));
            const detailScroll = document.getElementById('or-detail-scroll');
            if (!detailScroll) return;
            const items = (data.washOrderItems || []).filter(it => it.order_id == orderId);
            if (items.length === 0) {
                detailScroll.innerHTML = '<div class="or-empty">该订单暂无明细</div>';
                return;
            }
            const sourceText = s => s === 'price_list' ? '价目表' : s === 'price_list_category' ? '品类兜底' :
                s === 'customer_product' ? '清单价' : s === 'base_price' ? '基准价' : s === 'none' ? '⚠ 无价格' : '—';
            const totalAmount = items.reduce((s, it) => s + (it.total_price || 0), 0);
            const totalQty = items.reduce((s, it) => s + (it.billing_quantity || 0), 0);
            const rows = items.map(it => {
                const p = (data.customerProducts || []).find(x => x.id == it.product_id);
                const pname = p ? (p.product_name || '—') : '—';
                const noPrice = it.price_source === 'none' || !it.unit_price;
                return `<tr${noPrice ? ' style="background:#fff5f5;"' : ''}>
                    <td>${pname}</td>
                    <td>${it.forecast_quantity || 0}</td>
                    <td>${it.collect_quantity || 0}</td>
                    <td>${it.completed_quantity || 0}</td>
                    <td>${it.handover_quantity || 0}</td>
                    <td style="font-weight:600;">${it.billing_quantity || 0}</td>
                    <td style="text-align:right;">${it.unit_price != null ? '¥' + Number(it.unit_price).toFixed(2) : '—'}</td>
                    <td style="text-align:right;${noPrice ? 'color:#d9534f;' : 'font-weight:600;'}">${it.total_price != null ? '¥' + Number(it.total_price).toFixed(2) : '—'}</td>
                    <td style="font-size:12px;color:#666;">${sourceText(it.price_source)}</td>
                    <td>${it.note || ''}</td>
                </tr>`;
            }).join('');
            detailScroll.innerHTML = `
                <div style="margin-bottom:8px;">
                    <button class="btn btn-sm btn-primary" onclick="recalcOrderPrices(${orderId})">重算价格</button>
                    <span style="margin-left:12px;color:#666;font-size:13px;">合计：计费 ${totalQty} 件 / 金额 ¥${totalAmount.toFixed(2)}</span>
                </div>
                <table class="or-table"><thead><tr>
                    <th>产品名</th><th>预报</th><th>收洗</th><th>完成</th><th>交接</th><th>计费数量</th><th>单价</th><th>总价</th><th>价格来源</th><th>备注</th>
                </tr></thead><tbody>${rows}</tbody></table>`;
        }

        async function recalcOrderPrices(orderId) {
            if (!confirm('确定按当前价目表重算该订单的所有价格？\n历史快照将被覆盖。')) return;
            try {
                await washOrdersApi('recalcOrder', orderId);
                await loadData();
                selectOrderReport(orderId);
                alert('价格已重算');
            } catch (err) {
                alert('重算失败: ' + err.message);
            }
        }

        async function clearAllOrders() {
            if (!confirm('确定要清空所有订单数据吗？\n\n此操作将删除：\n- 所有收洗订单\n- 所有订单明细\n- 所有洗涤完成记录\n- 所有操作日志\n- 所有变更日志\n- 所有留言\n\n此操作不可恢复！')) return;
            try {
                await washOrdersApi('clear');
                await dbClear('wash_completions');
                await dbClear('wash_operations');
                await dbClear('order_item_changes');
                await dbClear('order_messages');
                await loadData();
                showPage('wash');
            } catch (err) {
                alert('清空失败: ' + err.message);
            }
        }

        function renderWash() {
            let orders = data.washOrders;
            if (currentUser.role === 'customer' && currentUser.customer_id) {
                orders = orders.filter(o => o.customer_id === currentUser.customer_id);
            }

            const stepCell = (done, name, time, enabled) => {
                if (enabled === false) return '<span style="color:#ccc;">—</span>';
                if (!done) return '<span style="color:#999;">-</span>';
                const t = time ? time.replace(/^\\d{4}-/, '').replace(' ', '\\n') : '';
                const n = name || '';
                return `<span style="color:#27ae60;font-weight:bold;">&#10003;</span><br><span style="font-size:11px;color:#666;">${n}${t ? '<br>' + t : ''}</span>`;
            };

            const grayHeader = (label, enabled) => enabled === false
                ? `<span style="color:#bbb;">${label}</span>`
                : label;

            return `
                <div class="card">
                    <div class="card-header">
                        <h2>收洗订单列表</h2>
                        <div style="display:flex;gap:8px;">
                            ${currentUser.role !== 'customer' ? '<button class="btn btn-sm btn-primary" onclick="showCreateWashOrderModal()">创建收洗订单</button>' : ''}
                            ${currentUser.role === 'admin' ? '<button class="btn btn-sm btn-danger" onclick="clearAllOrders()">清空所有订单</button>' : ''}
                        </div>
                    </div>
                    <div class="table-container">
                        <table class="data-table">
                            <tr><th>订单号</th><th>客户</th><th>二级客户</th><th>酒店预报</th><th>收洗</th><th>洗涤</th><th>送还</th><th>酒店确认</th><th>状态</th><th>操作</th></tr>
                            ${orders.map(order => {
                                const es = order.enabled_steps || {};
                                const curIdx = ['forecast','collect','wash','handover','completed'].indexOf(order.status);
                                return `
                                <tr>
                                    <td>${order.order_no}</td>
                                    <td>${order.customer_name}</td>
                                    <td>${order.secondary_customer || '<span style="color:#999;">公司默认</span>'}</td>
                                    <td>${stepCell(0 <= curIdx, order.forecast_user_name, order.forecast_time, es.forecast)}</td>
                                    <td>${stepCell(1 <= curIdx, order.collect_user_name, order.collect_time, es.collect)}</td>
                                    <td>${stepCell(2 <= curIdx, order.wash_user_name, order.wash_time, es.wash)}</td>
                                    <td>${stepCell(3 <= curIdx, order.handover_user_name, order.handover_time, es.handover)}</td>
                                    <td>${stepCell(4 <= curIdx, order.handover_confirmed_by_name, order.handover_confirmed_time, es.confirm)}</td>
                                    <td><span class="status-badge ${order.status === 'completed' ? 'status-active' : 'status-pending'}">${order.status === 'forecast' ? '待确认' : order.status === 'collect' ? '待收取' : order.status === 'wash' ? '洗涤中' : order.status === 'handover' ? '待酒店确认' : '已完成'}</span></td>
                                    <td><button class="btn-sm btn-detail" onclick="showWashOrderDetail(${order.id})">详情</button></td>
                                </tr>`;
                            }).join('')}
                            ${orders.length === 0 ? '<tr><td colspan="10" style="text-align:center;color:#999;padding:30px;">暂无收洗订单</td></tr>' : ''}
                        </table>
                    </div>
                </div>
            `;
        }

        function showCreateWashOrderModal() {
            const today = new Date().toISOString().split('T')[0];
            showModal('创建收洗订单', `
                <div class="form-group"><label>客户</label>
                    <select id="wo-customer" onchange="onWashCustomerChange()">${getMainCustomers().map(c => `<option value="${c.id}">${c.short_name}</option>`).join('')}</select>
                </div>
                <div class="form-group" id="wo-sec-group" style="display:none;"><label>二级客户（部门）</label>
                    <select id="wo-secondary" onchange="updateWashOrderProducts()"><option value="">公司默认</option></select>
                </div>
                <div class="form-group"><label>日期</label><input type="date" id="wo-date" value="${today}"></div>
                <div id="wo-items-container">
                </div>
                <button class="btn btn-add-row btn-sm" onclick="addWashOrderItemRow()">添加项目</button>
            `, `<button class="btn btn-primary" onclick="createWashOrder()">提交预报</button><button class="btn btn-secondary" onclick="closeModal()">取消</button>`);
            onWashCustomerChange();
            updateWashOrderProducts();
        }

        function onWashCustomerChange() {
            const customerId = document.getElementById('wo-customer')?.value;
            const secGroup = document.getElementById('wo-sec-group');
            const secSelect = document.getElementById('wo-secondary');
            if (!customerId || !secGroup || !secSelect) return;
            
            const customer = data.customers.find(c => c.id == customerId);
            let secondaryList = [];
            if (customer && customer.secondary_customers) {
                try { secondaryList = typeof customer.secondary_customers === 'string' ? JSON.parse(customer.secondary_customers) : customer.secondary_customers; } catch(e) {}
            }
            
            if (secondaryList.length > 0) {
                secGroup.style.display = '';
                secSelect.innerHTML = '<option value="">公司默认</option>' + 
                    secondaryList.map(s => `<option value="${s.department}">${s.department}</option>`).join('');
            } else {
                secGroup.style.display = 'none';
                secSelect.value = '';
            }
            updateWashOrderProducts();
        }

        function updateWashOrderProducts() {
            const customerId = document.getElementById('wo-customer')?.value;
            const secSelect = document.getElementById('wo-secondary');
            const secondaryCustomer = secSelect && secSelect.style.display !== 'none' ? (secSelect.value || '') : '';
            
            const products = data.customerProducts.filter(p => {
                if (p.customer_id != customerId) return false;
                if (!secondaryCustomer) return !p.secondary_customer;
                return p.secondary_customer === secondaryCustomer;
            });
            
            const container = document.getElementById('wo-items-container');
            if (!container) return;
            
            if (products.length > 0) {
                container.innerHTML = products.map(p => {
                    const displayName = p.product_name || '未命名';
                    return `<div class="row-item">
                        <input type="hidden" class="wo-product-id" value="${p.id}">
                        <span class="wo-product-name" style="min-width:120px;font-weight:500;">${displayName}</span>
                        <input type="number" class="wo-quantity" placeholder="数量" min="1" style="width:80px;">
                        <input type="text" class="wo-note" placeholder="备注" style="width:150px;">
                        <button class="btn-remove-row btn-sm btn-delete" onclick="removeRow(this)">×</button>
                    </div>`;
                }).join('');
            } else {
                container.innerHTML = `<div style="color:#999;padding:10px 0;text-align:center;">该客户暂无客户清单，请先在"客户清单"页设置品名方案</div>`;
            }
        }

        function addWashOrderItemRow() {
            const container = document.getElementById('wo-items-container');
            if (!container) return;
            // 获取当前客户所有产品供下拉选择
            const customerId = document.getElementById('wo-customer')?.value;
            const secSelect = document.getElementById('wo-secondary');
            const secondaryCustomer = secSelect && secSelect.style.display !== 'none' ? (secSelect.value || '') : '';
            const allProducts = data.customerProducts.filter(p => {
                if (p.customer_id != customerId) return false;
                if (!secondaryCustomer) return !p.secondary_customer;
                return p.secondary_customer === secondaryCustomer;
            });
            const optionsHtml = allProducts.length > 0
                ? allProducts.map(p => {
                    const displayName = p.product_name || '未命名';
                    return `<option value="${p.id}">${displayName}</option>`;
                }).join('')
                : '<option value="">无可用产品</option>';
            
            const rowHtml = `<div class="row-item" style="margin-top:8px;">
                <select class="wo-product">${optionsHtml}</select>
                <input type="number" class="wo-quantity" placeholder="数量" min="1" style="width:80px;">
                <input type="text" class="wo-note" placeholder="备注" style="width:150px;">
                <button class="btn-remove-row btn-sm btn-delete" onclick="removeRow(this)">×</button>
            </div>`;
            container.insertAdjacentHTML('beforeend', rowHtml);
        }

        async function createWashOrder() {
            const customerId = parseInt(document.getElementById('wo-customer').value);
            const secSelect = document.getElementById('wo-secondary');
            const secondaryCustomer = (secSelect && secSelect.style.display !== 'none') ? (secSelect.value || '') : '';
            const orderNo = 'WO' + new Date().toISOString().replace(/-/g, '').replace(/:/g, '').substring(0, 12) + Math.floor(Math.random() * 1000).toString().padStart(3, '0');
            
            const items = [];
            document.querySelectorAll('#wo-items-container .row-item').forEach(row => {
                const productIdInput = row.querySelector('.wo-product-id');
                const productSelect = row.querySelector('.wo-product');
                const productId = productIdInput ? parseInt(productIdInput.value) : (productSelect ? parseInt(productSelect.value) : null);
                const quantity = parseInt(row.querySelector('.wo-quantity').value);
                if (productId && quantity) {
                    items.push({ product_id: productId, forecast_quantity: quantity, note: row.querySelector('.wo-note').value });
                }
            });
            
            if (items.length === 0) {
                alert('请至少添加一个布草项目');
                return;
            }
            
            const order = {
                order_no: orderNo,
                customer_id: customerId,
                secondary_customer: secondaryCustomer,
                status: 'forecast',
                forecast_user_id: currentUser.id,
                forecast_time: new Date().toLocaleString('zh-CN'),
                forecast_confirmed: 0,
                items: items.map(item => ({
                    product_id: item.product_id,
                    forecast_quantity: item.forecast_quantity,
                    collect_quantity: 0,
                    completed_quantity: 0,
                    remaining_quantity: item.forecast_quantity,
                    handover_quantity: 0,
                    note: item.note
                }))
            };

            const result = await washOrdersApi('create', order);
            const orderId = result.id;
            
            await logWashOperation(orderId, 'forecast', currentUser.id, 'web');
            
            await loadData();
            showPage('wash');
            closeModal();
            alert('预报提交成功');
        }

        // 各步骤对应的可编辑列（字段名）
        const STEP_EDIT_COLS = {
            forecast: ['product_name', 'forecast_quantity'],
            collect: ['collect_quantity'],
            wash: ['completed_quantity', 'rewash_quantity', 'stain_removal_quantity', 'remaining_quantity'],
            handover: ['handover_quantity'],
            confirm: ['confirm_quantity']
        };

        // 列字段 → 显示名 + 宽度映射
        const DETAIL_COLS = [
            { key: 'product_name', label: '产品', width: '120px' },
            { key: 'forecast_quantity', label: '预报数量', width: '70px' },
            { key: 'collect_quantity', label: '收取数量', width: '70px' },
            { key: 'completed_quantity', label: '完成数量', width: '70px' },
            { key: 'rewash_quantity', label: '重洗数量', width: '65px' },
            { key: 'stain_removal_quantity', label: '除渍数量', width: '65px' },
            { key: 'remaining_quantity', label: '未完成数', width: '70px' },
            { key: 'handover_quantity', label: '交接数量', width: '70px' },
            { key: 'confirm_quantity', label: '确认数量', width: '70px' },
            { key: 'note', label: '备注', width: '100px' }
        ];

        function showWashOrderDetail(orderId, editStep, showRewash = true) {
            const order = data.washOrders.find(o => o.id === orderId);
            if (!order) return;
            
            const es = order.enabled_steps || {};
            // 当前 status 对应步骤及之前 = 彩色，之后 = 灰色
            const statusOrder = ['forecast', 'collect', 'wash', 'handover', 'completed'];
            const curIdx = statusOrder.indexOf(order.status);
            const stepIdx = { forecast: 0, collect: 1, wash: 2, handover: 3, confirm: 4 };
            const allSteps = [
                { key: 'forecast', label: '酒店预报', color: stepIdx.forecast <= curIdx ? '#f39c12' : '#95a5a6' },
                { key: 'collect', label: '收洗', color: stepIdx.collect <= curIdx ? '#3498db' : '#95a5a6' },
                { key: 'wash', label: '洗涤', color: stepIdx.wash <= curIdx ? '#9b59b6' : '#95a5a6' },
                { key: 'handover', label: '送还', color: stepIdx.handover <= curIdx ? '#e74c3c' : '#95a5a6' },
                { key: 'confirm', label: '酒店确认', color: stepIdx.confirm <= curIdx ? '#27ae60' : '#95a5a6' }
            ];
            const statusSteps = allSteps.filter(s => es[s.key] !== false)
                .map((s, i) => ({ ...s, label: (i + 1) + '.' + s.label }));
            
            const editMode = editStep || null;
            const editableCols = editMode ? (STEP_EDIT_COLS[editMode] || []) : [];
            const stepLabel = editMode ? allSteps.find(s => s.key === editMode)?.label || '' : '';
            
            const itemChanges = data.orderItemChanges || [];
            const orderChanges = itemChanges.filter(c => c.order_id === orderId).sort((a, b) => new Date(b.change_time) - new Date(a.change_time));
            
            // 构建明细表
            const detailTableRows = order.items.map(item => {
                const product = data.customerProducts.find(p => p.id === item.product_id);
                return `<tr>${DETAIL_COLS.map(col => {
                    if (col.key === 'product_name') {
                        const isEditable = editableCols.includes('product_name');
                        if (isEditable) {
                            const selOpts = data.customerProducts.filter(p => p.customer_id === order.customer_id)
                                .map(p => `<option value="${p.id}" ${item.product_id == p.id ? 'selected' : ''}>${p.product_name || '未命名'}</option>`).join('');
                            return `<td><select id="detail-product_name-${item.id}" style="width:110px;padding:3px;font-size:12px;border:2px solid #667eea;border-radius:4px;">
                                <option value="">— 请选择 —</option>${selOpts}
                            </select></td>`;
                        }
                        return `<td style="text-align:left;">${product ? (product.product_name || '—') : '—'}</td>`;
                    }
                    const isEditable = editableCols.includes(col.key);
                    const val = item[col.key];
                    const displayVal = (val !== undefined && val !== null) ? val : (col.key === 'note' ? '' : 0);
                    if (isEditable) {
                        const inputStyle = 'width:90%;min-width:50px;padding:3px 5px;border:2px solid #667eea;border-radius:4px;font-size:12px;text-align:center;';
                        return `<td><input type="${col.key === 'note' ? 'text' : 'number'}" id="detail-${col.key}-${item.id}" value="${col.key === 'note' ? (displayVal || '') : displayVal}" style="${inputStyle}" ${col.key !== 'note' ? 'min="0"' : ''}></td>`;
                    }
                    let cls = '';
                    if (col.key === 'rewash_quantity' && (item.rewash_quantity || 0) > 0) cls = 'style="color:#e74c3c;"';
                    if (col.key === 'remaining_quantity' && (item.remaining_quantity || 0) > 0) cls = 'style="color:#f39c12;font-weight:bold;"';
                    return `<td ${cls}>${col.key === 'note' ? (displayVal || '-') : displayVal}</td>`;
                }).join('')}</tr>`;
            }).join('') || '<tr><td colspan="10" style="text-align:center;color:#999;padding:20px;">暂无布草明细</td></tr>';
            
            // 流程进度图（圆圈可点击）
            const flowHtml = statusSteps.map((step, i) => {
                const isActive = editMode === step.key;
                const borderStyle = isActive ? 'border: 3px solid #333;' : '';
                const cursorStyle = 'cursor:pointer;';
                return `
                    <div style="text-align: center; ${cursorStyle}" onclick="showWashOrderDetail(${orderId}, '${editMode === step.key ? '' : step.key}', ${showRewash ? 'true' : 'false'})">
                        <div style="width: 36px; height: 36px; border-radius: 50%; background: ${step.color}; color: white; display: flex; justify-content: center; align-items: center; margin: 0 auto 5px; font-weight: bold; ${borderStyle}">${i+1}</div>
                        <div style="font-size: 12px; color: ${step.color};">${step.label}</div>
                        ${isActive ? '<div style="font-size:11px;color:#667eea;margin-top:2px;">✎ 编辑中</div>' : ''}
                    </div>
                    ${i < statusSteps.length - 1 ? '<div style="width: 30px; height: 2px; background: #ddd;"></div>' : ''}
                `;
            }).join('');
            
            showModal(`收洗订单详情 - ${order.order_no}${order.status === 'completed' ? '（完成）' : ''}`, `
                <div class="form-section"><h4>订单信息</h4>
                    <p><strong>客户：</strong>${order.customer_name}${order.secondary_customer ? ' / ' + order.secondary_customer : ''}</p>
                    <p><strong>状态：</strong>${order.status === 'completed' ? '<span style="color:#27ae60;font-weight:bold;">✓ 完成</span>' : (order.status === 'forecast' ? '待确认' : order.status === 'collect' ? '待收取' : order.status === 'wash' ? '洗涤中' : order.status === 'handover' ? '待酒店确认' : '已完成')}</p>
                </div>
                <div class="form-section"><h4>流程进度</h4>
                    <p style="font-size:12px;color:#999;margin-bottom:10px;">点击流程圆圈可进入对应环节的编辑模式</p>
                    <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                        ${flowHtml}
                    </div>
                    ${editMode ? `
                        <div style="margin-top:12px;">
                            <button class="btn btn-primary" onclick="saveDetailStepEdits(${orderId}, '${editMode}')">💾 保存${stepLabel}</button>
                            <button class="btn btn-secondary" style="margin-left:8px;" onclick="showWashOrderDetail(${orderId}, '', ${showRewash ? 'true' : 'false'})">取消编辑</button>
                        </div>
                    ` : ''}
                </div>
                <div class="form-section"><h4>布草明细</h4>

        async function saveDetailStepEdits(orderId, step) {
            const order = data.washOrders.find(o => o.id === orderId);
            if (!order) return;
            
            const editableCols = STEP_EDIT_COLS[step] || [];
            if (editableCols.length === 0) return;
            
            let hasChanges = false;
            for (const item of order.items) {
                const updates = { id: item.id, order_id: item.order_id, product_id: item.product_id };
                let itemChanged = false;
                
                // 保留原有字段值
                for (const col of DETAIL_COLS) {
                    if (col.key === 'product_name') continue;
                    updates[col.key] = item[col.key];
                }
                
                // 读取编辑后的值
                for (const colKey of editableCols) {
                    if (colKey === 'product_name') {
                        const select = document.getElementById(`detail-product_name-${item.id}`);
                        if (select && select.value) {
                            const newPid = parseInt(select.value);
                            if (newPid !== item.product_id) {
                                updates.product_id = newPid;
                                itemChanged = true;
                                hasChanges = true;
                            }
                        }
                        continue;
                    }
                    const input = document.getElementById(`detail-${colKey}-${item.id}`);
                    if (!input) continue;
                    const newVal = colKey === 'note' ? input.value : (parseInt(input.value) || 0);
                    if (newVal !== (item[colKey] || (colKey === 'note' ? '' : 0))) {
                        updates[colKey] = newVal;
                        itemChanged = true;
                        hasChanges = true;
                    }
                }
                
                // 洗涤步骤额外联动计算
                if (step === 'wash' && itemChanged) {
                    // remaining = forecast - completed
                    const fq = updates.forecast_quantity || item.forecast_quantity || 0;
                    const cq = updates.completed_quantity !== undefined ? updates.completed_quantity : (item.completed_quantity || 0);
                    updates.remaining_quantity = Math.max(0, fq - cq);
                }
                
                if (itemChanged) {
                    await washOrdersApi('updateItem', updates);
                    // 记录变更日志
                    const operatorName = currentUser.name || currentUser.username || '未知';
                    await dbPut('order_item_changes', {
                        order_id: orderId,
                        product_id: item.product_id,
                        operator_id: currentUser.id,
                        operator_name: operatorName,
                        change_type: 'update',
                        change_time: new Date().toLocaleString('zh-CN'),
                        qty_change: (updates.forecast_quantity || 0) - (item.forecast_quantity || 0),
                        rewash_change: (updates.rewash_quantity || 0) - (item.rewash_quantity || 0),
                        stain_change: (updates.stain_removal_quantity || 0) - (item.stain_removal_quantity || 0),
                        note: ''
                    });
                }
            }
            
            // 同步读取返洗表格编辑值
            let rewashChanged = false;
            if (data._rewashItems && data._rewashItems[orderId]) {
                for (const ritem of data._rewashItems[orderId]) {
                    for (const colKey of editableCols) {
                        const input = document.getElementById(`rewash-${colKey}-${ritem._idx}`);
                        if (input) {
                            const newVal = colKey === 'note' ? input.value : (parseInt(input.value) || 0);
                            if (newVal !== (ritem[colKey] || (colKey === 'note' ? '' : 0))) {
                                ritem[colKey] = newVal;
                                rewashChanged = true;
                            }
                        }
                    }
                    const pSelect = document.getElementById(`rewash-product-${ritem._idx}`);
                    if (pSelect && pSelect.value !== (ritem.product_id || '')) {
                        ritem.product_id = pSelect.value;
                        const cp = data.customerProducts.find(p => p.id == ritem.product_id);
                        if (cp) ritem._product_name = cp.product_name || cp.cloth_name;
                        rewashChanged = true;
                    }
                }
            }
            
            if (hasChanges || rewashChanged) {
                // 编辑哪一步保存，订单状态就停留在该步骤；酒店确认保存后整体完成
                const stepToStatus = { forecast: 'forecast', collect: 'collect', wash: 'wash', handover: 'handover', confirm: 'completed' };
                const newStatus = stepToStatus[step] || order.status;
                if (newStatus !== order.status) {
                    await washOrdersApi('update', {
                        id: order.id, order_no: order.order_no, customer_id: order.customer_id,
                        status: newStatus,
                        forecast_user_id: order.forecast_user_id, forecast_time: order.forecast_time, forecast_confirmed: order.forecast_confirmed,
                        forecast_confirmed_by: order.forecast_confirmed_by, forecast_confirmed_time: order.forecast_confirmed_time,
                        collect_user_id: order.collect_user_id, collect_time: order.collect_time, collect_confirmed: order.collect_confirmed,
                        wash_user_id: order.wash_user_id, wash_time: order.wash_time, wash_confirmed: order.wash_confirmed,
                        handover_user_id: order.handover_user_id, handover_time: order.handover_time, handover_confirmed: order.handover_confirmed,
                        handover_confirmed_by: order.handover_confirmed_by, handover_confirmed_time: order.handover_confirmed_time,
                        note: order.note
                    });
                    await logWashOperation(orderId, step, currentUser.id, 'web');
                }
                const rewashVisible = document.querySelector('#modal-body h4') &&
                    Array.from(document.querySelectorAll('#modal-body h4')).some(h => h.textContent.includes('酒店返洗'));
                await loadData();
                showWashOrderDetail(orderId, '', rewashVisible); // 退出编辑模式重新渲染，保留返洗视图
                alert('已保存');
            } else {
                alert('未检测到变更');
            }
        }

        // 返洗明细：添加行
        function addRewashRow(orderId, editMode) {
            if (!data._rewashItems) data._rewashItems = {};
            if (!data._rewashItems[orderId]) data._rewashItems[orderId] = [];
            const maxIdx = data._rewashItems[orderId].reduce((max, item) => Math.max(max, item._idx || 0), 0);
            data._rewashItems[orderId].push({ _idx: maxIdx + 1, product_id: '', forecast_quantity: 0, collect_quantity: 0, completed_quantity: 0, rewash_quantity: 0, stain_removal_quantity: 0, remaining_quantity: 0, handover_quantity: 0, confirm_quantity: 0, note: '' });
            showWashOrderDetail(orderId, editMode || '', true);
        }

        // 返洗明细：删除行
        function removeRewashRow(orderId, idx, editMode) {
            if (!data._rewashItems || !data._rewashItems[orderId]) return;
            data._rewashItems[orderId] = data._rewashItems[orderId].filter(item => item._idx !== idx);
            showWashOrderDetail(orderId, editMode || '', true);
        }

        // 返洗明细：保存
        async function saveRewashItems(orderId, editMode) {
            if (!data._rewashItems || !data._rewashItems[orderId]) return;
            // 读取编辑后的值
            const savedItems = [];
            for (const item of data._rewashItems[orderId]) {
                const productSelect = document.getElementById(`rewash-product-${item._idx}`);
                const productId = productSelect ? productSelect.value : '';
                if (!productId) continue; // 跳过未选产品的行
                const entry = { order_id: orderId, product_id: productId, _idx: item._idx };
                if (item._id) entry.id = item._id;   // 已有记录则更新而非新增
                for (const col of DETAIL_COLS) {
                    if (col.key === 'product_name') continue;
                    const input = document.getElementById(`rewash-${col.key}-${item._idx}`);
                    if (input) {
                        entry[col.key] = col.key === 'note' ? input.value : (parseInt(input.value) || 0);
                    }
                }
                savedItems.push(entry);
            }
            // 更新内存数据
            for (const entry of savedItems) {
                const existingItem = data._rewashItems[orderId].find(i => i._idx === entry._idx);
                if (existingItem) Object.assign(existingItem, entry);
            }
            // 保存到数据库（使用 wash_order_items 表，标记为返洗类型）
            for (const entry of savedItems) {
                const payload = { ...entry, is_rewash: 1 };
                delete payload._idx;
                delete payload._product_name;
                let result;
                if (entry.id) {
                    await washOrdersApi('updateItem', payload);
                    result = { id: entry.id };
                } else {
                    result = await washOrdersApi('addItem', payload);
                }
                // 回写 DB 生成的 id，确保再次保存时更新而非新增
                if (result && result.id && !entry.id) {
                    const memItem = data._rewashItems[orderId].find(i => i._idx === entry._idx);
                    if (memItem) memItem._id = result.id;
                }
            }
            // 清理已删除的行
            const validIdxs = new Set(savedItems.map(i => i._idx));
            data._rewashItems[orderId] = data._rewashItems[orderId].filter(i => validIdxs.has(i._idx));
            showWashOrderDetail(orderId, editMode || '', true);
            alert('返洗明细已保存');
        }

        async function saveOrderItemChanges(orderId) {
            const order = data.washOrders.find(o => o.id === orderId);
            if (!order) return;
            
            let hasChanges = false;
            
            for (const item of order.items) {
                const qtyInput = document.getElementById(`edit-qty-${item.id}`);
                const rewashInput = document.getElementById(`edit-rewash-${item.id}`);
                const stainInput = document.getElementById(`edit-stain-${item.id}`);
                const noteInput = document.getElementById(`edit-note-${item.id}`);
                
                if (qtyInput) {
                    const qtyChange = parseInt(qtyInput.value) || 0;
                    const rewashChange = parseInt(rewashInput.value) || 0;
                    const stainChange = parseInt(stainInput.value) || 0;
                    const note = noteInput.value;
                    
                    if (qtyChange !== 0 || rewashChange !== 0 || stainChange !== 0 || note) {
                        hasChanges = true;
                        
                        const itemChanges = data.orderItemChanges || [];
                        const existingChanges = itemChanges.filter(c => c.order_item_id === item.id);
                        const isFirstAdd = existingChanges.length === 0 && item.forecast_quantity === 0 && qtyChange > 0;
                        const changeType = isFirstAdd ? 'first_add' : (qtyChange > 0 ? 'add' : qtyChange < 0 ? 'reduce' : 'update');
                        
                        await logOrderItemChange(orderId, item.product_id, item.id, changeType, qtyChange, rewashChange, stainChange, note);
                        
                        const newForecastQty = item.forecast_quantity + qtyChange + stainChange;
                        const newRewashQty = (item.rewash_quantity || 0) + rewashChange;
                        const newStainQty = (item.stain_removal_quantity || 0) + stainChange;
                        
                        await washOrdersApi('updateItem', {
                            id: item.id,
                            order_id: item.order_id,
                            product_id: item.product_id,
                            forecast_quantity: newForecastQty,
                            collect_quantity: item.collect_quantity,
                            completed_quantity: item.completed_quantity,
                            remaining_quantity: newForecastQty - item.completed_quantity,
                            handover_quantity: item.handover_quantity,
                            rewash_quantity: newRewashQty,
                            stain_removal_quantity: newStainQty,
                            note: note || item.note
                        });
                    }
                }
            }
            
            const newProductSelect = document.getElementById('new-product');
            if (newProductSelect) {
                const productId = parseInt(newProductSelect.value);
                const qtyInput = document.getElementById('new-qty');
                const rewashInput = document.getElementById('new-rewash');
                const stainInput = document.getElementById('new-stain');
                const noteInput = document.getElementById('new-note');
                
                if (productId && qtyInput && parseInt(qtyInput.value) > 0) {
                    hasChanges = true;
                    
                    const qty = parseInt(qtyInput.value);
                    const rewash = parseInt(rewashInput.value) || 0;
                    const stain = parseInt(stainInput.value) || 0;
                    const note = noteInput.value;
                    
                    const newItem = {
                        order_id: orderId,
                        product_id: productId,
                        forecast_quantity: qty + stain,
                        collect_quantity: 0,
                        completed_quantity: 0,
                        remaining_quantity: qty + stain,
                        handover_quantity: 0,
                        rewash_quantity: rewash,
                        stain_removal_quantity: stain,
                        note: note
                    };

                    const result = await washOrdersApi('addItem', newItem);
                    const itemId = result.id;
                    
                    await logOrderItemChange(orderId, productId, itemId, 'first_add', qty, rewash, stain, note);
                }
            }
            
            if (hasChanges) {
                await loadData();
                showWashOrderDetail(orderId);
                alert('变更已保存');
            } else {
                alert('未检测到变更');
            }
        }

        async function logOrderItemChange(orderId, productId, orderItemId, changeType, qtyChange, rewashChange, stainChange, note) {
            await dbPut('order_item_changes', {
                order_id: orderId,
                order_item_id: orderItemId,
                product_id: productId,
                operator_id: currentUser.id,
                change_time: new Date().toLocaleString('zh-CN'),
                change_type: changeType,
                qty_change: qtyChange,
                rewash_change: rewashChange,
                stain_change: stainChange,
                note: note
            });
        }

        async function confirmForecast(orderId) {
            const order = data.washOrders.find(o => o.id === orderId);
            if (!order) return;
            
            const user = data.users.find(u => u.id === currentUser.id);

                const bioResult = await simulateBiometric('确认预报需要验证身份');

                    alert('身份验证失败');
                    return;
                }
                await logWashOperation(orderId, 'forecast_confirm', currentUser.id, 'web', 'fingerprint', true);
            } else {
                await logWashOperation(orderId, 'forecast_confirm', currentUser.id, 'web');
            }
            
            await washOrdersApi('update', {
                id: order.id,
                order_no: order.order_no,
                customer_id: order.customer_id,
                status: 'collect',
                forecast_user_id: order.forecast_user_id,
                forecast_time: order.forecast_time,
                forecast_confirmed: 1,
                forecast_confirmed_by: currentUser.id,
                forecast_confirmed_time: new Date().toLocaleString('zh-CN'),
                collect_user_id: order.collect_user_id,
                collect_time: order.collect_time,
                collect_confirmed: order.collect_confirmed,
                wash_user_id: order.wash_user_id,
                wash_time: order.wash_time,
                wash_confirmed: order.wash_confirmed,
                handover_user_id: order.handover_user_id,
                handover_time: order.handover_time,
                handover_confirmed: order.handover_confirmed,
                handover_confirmed_by: order.handover_confirmed_by,
                handover_confirmed_time: order.handover_confirmed_time,
                note: order.note,
                updated_at: new Date().toLocaleString('zh-CN')
            });
            
            await loadData();
            showWashOrderDetail(orderId);
        }

        async function collectWashOrder(orderId) {
            const order = data.washOrders.find(o => o.id === orderId);
            if (!order) return;
            
            await washOrdersApi('update', {
                id: order.id,
                order_no: order.order_no,
                customer_id: order.customer_id,
                status: 'wash',
                forecast_user_id: order.forecast_user_id,
                forecast_time: order.forecast_time,
                forecast_confirmed: order.forecast_confirmed,
                forecast_confirmed_by: order.forecast_confirmed_by,
                forecast_confirmed_time: order.forecast_confirmed_time,
                collect_user_id: currentUser.id,
                collect_time: new Date().toLocaleString('zh-CN'),
                collect_confirmed: 1,
                wash_user_id: order.wash_user_id,
                wash_time: order.wash_time,
                wash_confirmed: order.wash_confirmed,
                handover_user_id: order.handover_user_id,
                handover_time: order.handover_time,
                handover_confirmed: order.handover_confirmed,
                handover_confirmed_by: order.handover_confirmed_by,
                handover_confirmed_time: order.handover_confirmed_time,
                note: order.note,
                updated_at: new Date().toLocaleString('zh-CN')
            });
            
            for (const item of order.items) {
                await washOrdersApi('updateItem', {
                    id: item.id,
                    order_id: item.order_id,
                    product_id: item.product_id,
                    forecast_quantity: item.forecast_quantity,
                    collect_quantity: item.forecast_quantity,
                    completed_quantity: item.completed_quantity,
                    remaining_quantity: item.forecast_quantity,
                    handover_quantity: item.handover_quantity,
                    rewash_quantity: item.rewash_quantity || 0,
                    stain_removal_quantity: item.stain_removal_quantity || 0,
                    note: item.note
                });
            }
            
            await logWashOperation(orderId, 'collect', currentUser.id, 'mobile');
            
            await loadData();
            showWashOrderDetail(orderId);
        }

        function showWashCompletionModal(orderId) {
            const order = data.washOrders.find(o => o.id === orderId);
            if (!order) return;
            
            let itemsHtml = '';
            order.items.forEach(item => {
                itemsHtml += `
                    <div class="form-row">
                        <div class="form-group"><label>${item.product_name || item.cloth_name} (${item.spec_name})</label></div>
                        <div class="form-group"><label>本次完成数量</label><input type="number" class="wc-quantity" data-item-id="${item.id}" min="1" max="${item.remaining_quantity}"></div>
                        <div class="form-group"><label>备注</label><input type="text" class="wc-note" data-item-id="${item.id}"></div>
                    </div>
                `;
            });
            
            showModal('洗涤完成录入', `
                <input type="hidden" id="wc-order-id" value="${orderId}">
                ${itemsHtml}
            `, `<button class="btn btn-primary" onclick="submitWashCompletion()">提交完成数量</button><button class="btn btn-secondary" onclick="closeModal()">取消</button>`);
        }

        async function submitWashCompletion() {
            const orderId = parseInt(document.getElementById('wc-order-id').value);
            const order = data.washOrders.find(o => o.id === orderId);
            if (!order) return;
            
            let hasCompletion = false;
            document.querySelectorAll('.wc-quantity').forEach(input => {
                const itemId = parseInt(input.dataset.itemId);
                const quantity = parseInt(input.value);
                if (quantity && quantity > 0) {
                    hasCompletion = true;
                }
            });
            
            if (!hasCompletion) {
                alert('请至少输入一个完成数量');
                return;
            }
            
            let allCompleted = true;
            for (const item of order.items) {
                const input = document.querySelector(`.wc-quantity[data-item-id="${item.id}"]`);
                const noteInput = document.querySelector(`.wc-note[data-item-id="${item.id}"]`);
                const quantity = parseInt(input.value) || 0;
                
                if (quantity > 0) {
                    await dbPut('wash_completions', {
                        order_item_id: item.id,
                        quantity: quantity,
                        completed_time: new Date().toLocaleString('zh-CN'),
                        completed_by: currentUser.id,
                        note: noteInput.value
                    });
                    
                    const newCompleted = item.completed_quantity + quantity;
                    const newRemaining = item.collect_quantity - newCompleted;
                    
                    await washOrdersApi('updateItem', {
                        id: item.id,
                        order_id: item.order_id,
                        product_id: item.product_id,
                        forecast_quantity: item.forecast_quantity,
                        collect_quantity: item.collect_quantity,
                        completed_quantity: newCompleted,
                        remaining_quantity: newRemaining,
                        handover_quantity: item.handover_quantity,
                        rewash_quantity: item.rewash_quantity || 0,
                        stain_removal_quantity: item.stain_removal_quantity || 0,
                        note: item.note
                    });
                    
                    if (newRemaining > 0) allCompleted = false;
                }
            }
            
            await washOrdersApi('update', {
                id: order.id,
                order_no: order.order_no,
                customer_id: order.customer_id,
                status: allCompleted ? 'handover' : 'wash',
                forecast_user_id: order.forecast_user_id,
                forecast_time: order.forecast_time,
                forecast_confirmed: order.forecast_confirmed,
                forecast_confirmed_by: order.forecast_confirmed_by,
                forecast_confirmed_time: order.forecast_confirmed_time,
                collect_user_id: order.collect_user_id,
                collect_time: order.collect_time,
                collect_confirmed: order.collect_confirmed,
                wash_user_id: currentUser.id,
                wash_time: new Date().toLocaleString('zh-CN'),
                wash_confirmed: allCompleted ? 1 : 0,
                handover_user_id: order.handover_user_id,
                handover_time: order.handover_time,
                handover_confirmed: order.handover_confirmed,
                handover_confirmed_by: order.handover_confirmed_by,
                handover_confirmed_time: order.handover_confirmed_time,
                note: order.note,
                updated_at: new Date().toLocaleString('zh-CN')
            });
            
            await logWashOperation(orderId, 'wash', currentUser.id, 'web');
            
            await loadData();
            showWashOrderDetail(orderId);
        }

        async function handoverWashOrder(orderId) {
            const order = data.washOrders.find(o => o.id === orderId);
            if (!order) return;
            
            for (const item of order.items) {
                await washOrdersApi('updateItem', {
                    id: item.id,
                    order_id: item.order_id,
                    product_id: item.product_id,
                    forecast_quantity: item.forecast_quantity,
                    collect_quantity: item.collect_quantity,
                    completed_quantity: item.completed_quantity,
                    remaining_quantity: item.remaining_quantity,
                    handover_quantity: item.completed_quantity + (item.stain_removal_quantity || 0),
                    rewash_quantity: item.rewash_quantity || 0,
                    stain_removal_quantity: item.stain_removal_quantity || 0,
                    note: item.note
                });
            }
            
            await washOrdersApi('update', {
                id: order.id,
                order_no: order.order_no,
                customer_id: order.customer_id,
                status: 'handover',
                forecast_user_id: order.forecast_user_id,
                forecast_time: order.forecast_time,
                forecast_confirmed: order.forecast_confirmed,
                forecast_confirmed_by: order.forecast_confirmed_by,
                forecast_confirmed_time: order.forecast_confirmed_time,
                collect_user_id: order.collect_user_id,
                collect_time: order.collect_time,
                collect_confirmed: order.collect_confirmed,
                wash_user_id: order.wash_user_id,
                wash_time: order.wash_time,
                wash_confirmed: order.wash_confirmed,
                handover_user_id: currentUser.id,
                handover_time: new Date().toLocaleString('zh-CN'),
                handover_confirmed: order.handover_confirmed,
                handover_confirmed_by: order.handover_confirmed_by,
                handover_confirmed_time: order.handover_confirmed_time,
                note: order.note,
                updated_at: new Date().toLocaleString('zh-CN')
            });
            
            await logWashOperation(orderId, 'handover', currentUser.id, 'mobile');
            
            await loadData();
            showWashOrderDetail(orderId);
        }

        async function confirmHandover(orderId) {
            const order = data.washOrders.find(o => o.id === orderId);

            const user = data.users.find(u => u.id === currentUser.id);
            if (user.require_confirm) {
                const bioResult = await simulateBiometric('客户确认交接需要验证身份');
                if (!bioResult) {
                    alert('身份验证失败');
                    return;
                }
                await logWashOperation(orderId, 'handover_confirm', currentUser.id, 'web', 'fingerprint', true);
            } else {
                await logWashOperation(orderId, 'handover_confirm', currentUser.id, 'web');
            }
            
            await washOrdersApi('update', {
                id: order.id,
                order_no: order.order_no,
                customer_id: order.customer_id,
                status: 'completed',
                forecast_user_id: order.forecast_user_id,
                forecast_time: order.forecast_time,
                forecast_confirmed: order.forecast_confirmed,
                forecast_confirmed_by: order.forecast_confirmed_by,
                forecast_confirmed_time: order.forecast_confirmed_time,
                collect_user_id: order.collect_user_id,
                collect_time: order.collect_time,
                collect_confirmed: order.collect_confirmed,
                wash_user_id: order.wash_user_id,
                wash_time: order.wash_time,
                wash_confirmed: order.wash_confirmed,
                handover_user_id: order.handover_user_id,
                handover_time: order.handover_time,

                handover_confirmed_by: currentUser.id,
                handover_confirmed_time: new Date().toLocaleString('zh-CN'),

                updated_at: new Date().toLocaleString('zh-CN')
            });
            
            await loadData();
            showWashOrderDetail(orderId);
            alert('交接确认完成');
        }

        async function simulateBiometric(message) {
            return new Promise((resolve) => {
                const dialog = document.createElement('div');
                dialog.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:30px;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.3);z-index:2000;text-align:center;';
                dialog.innerHTML = `
                    <h3>${message}</h3>
                    <div style="margin:20px 0;">
                        <div style="width:80px;height:80px;border-radius:50%;background:#667eea;margin:0 auto 10px;display:flex;justify-content:center;align-items:center;color:white;font-size:32px;">🔒</div>
                        <p>请进行生物识别验证</p>
                    </div>
                    <button onclick="this.parentElement.parentElement.remove();window.bioResult=true;window.bioResolve(true);" style="padding:10px 30px;background:#27ae60;color:white;border:none;border-radius:6px;cursor:pointer;margin-right:10px;">验证通过</button>
                    <button onclick="this.parentElement.parentElement.remove();window.bioResult=false;window.bioResolve(false);" style="padding:10px 30px;background:#e74c3c;color:white;border:none;border-radius:6px;cursor:pointer;">验证失败</button>
                `;
                document.body.appendChild(dialog);
                
                window.bioResolve = resolve;
            });
        }

        function showModal(title, body, footer) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = body;
            document.getElementById('modal-footer').innerHTML = footer;
            document.getElementById('modal-overlay').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('show');
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('currentUser');
            document.getElementById('main-layout').style.display = 'none';
            document.getElementById('login-container').style.display = 'flex';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            loadSavedCredentials();
        }

        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        async function initApp() {
            try {
                await initDB();
                await initSampleData();
                await migrateCustomersToV20();
                loadSavedCredentials();
            } catch (err) {
                console.error('数据库初始化失败:', err);
                alert('数据库初始化失败，请刷新页面重试');
            }
        }

        initApp();
    </script>
