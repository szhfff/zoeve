<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoeve洗涤管理系统</title>
    <style>

        body { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; min-height: 100vh; }
        #app { min-height: 100vh; }

        .form-group label { display: block; margin-bottom: 6px; color: #333; font-weight: 500; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 14px; outline: none; transition: all 0.3s; }

        .tab-btn:hover { color: #667eea; }
        .tab-btn.active { color: #667eea; border-bottom-color: #667eea; font-weight: 600; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }
        .btn-secondary { background: #f5f5f5; color: #666; }
        .btn-secondary:hover { background: #eee; }

        .btn-add-row:hover { background: #27ae60; }
        .btn-remove-row { background: #e74c3c; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; margin-left: 5px; }

        .error-message { background: #ffebee; color: #c62828; padding: 10px; border-radius: 6px; margin-bottom: 15px; text-align: center; display: none; font-size: 14px; }
        .main-layout { display: none; height: 100vh; }
        .sidebar { width: 250px; background: #2c3e50; color: white; display: flex; flex-direction: column; float: left; height: 100%; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #34495e; }
        .sidebar-header h2 { font-size: 18px; }
        .sidebar-nav { flex: 1; padding: 10px; overflow-y: auto; overflow-x: hidden; }
        .nav-item { padding: 12px 16px; border-radius: 8px; margin-bottom: 4px; cursor: pointer; color: #bdc3c7; transition: all 0.3s; }
        .nav-item:hover { background: #34495e; color: white; }
        .nav-item.active { background: #667eea; color: white; }
        .nav-parent > div:first-child { display: flex; justify-content: space-between; align-items: center; }
        .nav-arrow { font-size: 12px; color: #95a5a6; }
        .nav-submenu { display: none; padding-left: 20px; }
        .nav-submenu.show { display: block; }
        .nav-subitem { padding: 10px 16px; border-radius: 6px; margin-bottom: 2px; cursor: pointer; color: #95a5a6; transition: all 0.3s; font-size: 14px; }
        .nav-subitem:hover { background: #34495e; color: white; }
        .nav-subitem.active { background: #667eea; color: white; }
        .sidebar-footer { padding: 15px; border-top: 1px solid #34495e; }
        .user-info { display: flex; align-items: center; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; margin-right: 12px; color: white; font-weight: 600; }
        .user-name { font-size: 14px; font-weight: 600; }
        .user-role { font-size: 12px; color: #95a5a6; }
        .logout-btn { background: transparent; border: none; color: #e74c3c; cursor: pointer; padding: 8px 16px; border-radius: 4px; margin-top: 10px; width: 100%; text-align: left; }
        .logout-btn:hover { background: rgba(231,76,60,0.2); }
        .content-area { margin-left: 250px; height: 100vh; display: flex; flex-direction: column; background: #ecf0f1; }
        .content-header { background: white; padding: 20px; border-bottom: 1px solid #ddd; }
        .content-header h1 { font-size: 24px; color: #2c3e50; }
        .content-body { flex: 1; padding: 20px; overflow-y: auto; }
        .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 24px; margin-bottom: 20px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .card-header h2 { font-size: 18px; color: #2c3e50; }

        .floating-sysinfo.show { display: flex; }
        .floating-sysinfo .fsi-header { padding: 10px 16px; background: #2c3e50; color: white; display: flex; justify-content: space-between; align-items: center; cursor: move; user-select: none; flex-shrink: 0; border-radius: 12px 12px 0 0; }
        .floating-sysinfo .fsi-header h3 { font-size: 15px; margin: 0; }
        .floating-sysinfo .fsi-header .fsi-btns { display: flex; gap: 8px; align-items: center; }
        .floating-sysinfo .fsi-header .fsi-btns button { background: rgba(255,255,255,0.2); border: none; color: white; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .floating-sysinfo .fsi-header .fsi-btns button:hover { background: rgba(255,255,255,0.35); }
        .floating-sysinfo .fsi-body { padding: 15px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
        .floating-sysinfo .fsi-body textarea { width: 100%; flex: 1; min-height: 250px; resize: vertical; font-family: monospace; font-size: 14px; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .floating-sysinfo .fsi-footer { padding: 8px 15px; border-top: 1px solid #eee; font-size: 12px; color: #999; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        /* 四条边拖拽调整大小 */
        .floating-sysinfo .fsi-resize-r { position: absolute; right: 0; top: 0; bottom: 0; width: 8px; cursor: e-resize; z-index: 10; }
        .floating-sysinfo .fsi-resize-l { position: absolute; left: 0; top: 0; bottom: 0; width: 8px; cursor: w-resize; z-index: 10; }
        .floating-sysinfo .fsi-resize-b { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; cursor: s-resize; z-index: 10; }
        .floating-sysinfo .fsi-resize-br { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; z-index: 11; }
        .floating-sysinfo .fsi-resize-bl { position: absolute; left: 0; bottom: 0; width: 18px; height: 18px; cursor: nesw-resize; z-index: 11; }
        /* 最小化 */
        .floating-sysinfo.minimized { min-height: auto; height: auto !important; width: 280px !important; }
        .floating-sysinfo.minimized .fsi-body,
        .floating-sysinfo.minimized .fsi-footer,
        .floating-sysinfo.minimized .fsi-resize-r,
        .floating-sysinfo.minimized .fsi-resize-l,
        .floating-sysinfo.minimized .fsi-resize-b,
        .floating-sysinfo.minimized .fsi-resize-br,
        .floating-sysinfo.minimized .fsi-resize-bl { display: none; }
        .floating-sysinfo.minimized .fsi-header { border-radius: 12px; }
        /* 最大化 */
        .floating-sysinfo.maximized { top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; min-width: 0 !important; min-height: 0 !important; border-radius: 0 !important; transform: none !important; }
        .floating-sysinfo.maximized .fsi-header { border-radius: 0 !important; }
        .floating-sysinfo.maximized .fsi-body textarea { min-height: calc(100vh - 140px); }
        .third-width { width: 33.33%; display: inline-block; padding-right: 15px; }
        .table-container { max-height: 400px; overflow-y: auto; }
        .customer-filter { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .filter-select { padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px; }
    .action-buttons { display: flex; flex-direction: column; gap: 2px; }
        
.move-btn {

<body>
    <div id="app">
        <div class="login-container" id="login-container">
            <div class="login-box">
                <div class="login-header">
                    <div class="login-logo">Z</div>
                    <h1>Zoeve洗涤管理系统</h1>
                    <p>请登录您的账户</p>
                </div>
                <div class="error-message" id="login-error"></div>
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="username" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" placeholder="请输入密码">
                </div>
                <div class="checkbox-group">
                    <label class="checkbox-item">
                        <input type="checkbox" id="save-username">保存用户名
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="save-password">保存密码
                    </label>
                </div>
                <button class="btn btn-primary" onclick="handleLogin()" style="width: 100%; margin-top: 20px;">登 录</button>
                <div style="text-align: center; margin-top: 20px;">
                    <button class="btn btn-secondary" onclick="handleWechatLogin()" style="margin-right: 10px;">微信登录</button>
                    <button class="btn btn-secondary" onclick="handleFingerprintLogin()">指纹登录</button>
                </div>
            </div>
        </div>
        <div class="main-layout" id="main-layout">
            <div class="sidebar">
                <div class="sidebar-header">
                    <h2>Zoeve洗涤管理系统</h2>
                </div>
                <div class="sidebar-nav" id="sidebar-nav"></div>
                <div class="sidebar-footer">
                    <div class="user-info">
                        <div class="user-avatar" id="user-avatar"></div>
                        <div>
                            <div class="user-name" id="user-name"></div>
                            <div class="user-role" id="user-role"></div>
                        </div>
                    </div>
                    <button class="logout-btn" onclick="handleLogout()">退出登录</button>
                </div>
            </div>
            <div class="content-area">
                <div class="content-header">
                    <h1 id="page-title">欢迎</h1>
                </div>
                <div class="content-body" id="content-body"></div>
            </div>
        </div>
        <div class="modal-overlay" id="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modal-title"></h3>
                    <button class="modal-close" onclick="closeModal()">&times;</button>
                </div>
                <div class="modal-body" id="modal-body"></div>
                <div class="modal-footer" id="modal-footer"></div>
            </div>
        </div>
        <!-- 系统说明浮动弹窗 -->
        <div class="floating-sysinfo" id="floating-sysinfo">
            <div class="fsi-header" id="fsi-header">
                <h3>📋 系统说明</h3>
                <div class="fsi-btns">
                    <button onclick="toggleMinimizeSysInfo()" id="fsi-min-btn" title="最小化">—</button>
                    <button onclick="toggleMaximizeSysInfo()" id="fsi-max-btn" title="最大化">□</button>
                    <button onclick="saveFloatingSysInfo()" title="保存">💾 保存</button>
                    <button onclick="closeFloatingSysInfo()" title="关闭">&times;</button>
                </div>
            </div>
            <div class="fsi-body" id="fsi-body">
                <textarea id="fsi-textarea" oninput="floatingSysInfoInput()" placeholder="系统说明内容..."></textarea>
            </div>
            <div class="fsi-footer">
                <span id="fsi-sync-status">✅ 已同步</span>
                <span>可拖拽标题栏移动 · 拖拽边缘调整大小 · 保存后同步至主页面</span>
            </div>
            <div class="fsi-resize-r" id="fsi-resize-r"></div>
            <div class="fsi-resize-l" id="fsi-resize-l"></div>
            <div class="fsi-resize-b" id="fsi-resize-b"></div>
            <div class="fsi-resize-br" id="fsi-resize-br"></div>
            <div class="fsi-resize-bl" id="fsi-resize-bl"></div>
        </div>

    <script>
        let currentUser = null;
        let currentPage = 'welcome';

        // ====== 初始密码 & 首次登录改密 配置 ======
        const DEFAULT_INITIAL_PASSWORD = '123456';

        // 旧用户兼容归一化：补全 must_change_pwd / initial_password / phone 字段
        // 规则：
        // - superadmin：永不改密
        // - 密码 === 初始密码：必定要改密
        // - 没有 must_change_pwd 字段（老数据）且不是 superadmin：要改密
        // - 改密判断同时看密码字段是否等于初始密码
        function normalizeUserForLogin(u) {
            if (!u) return u;
            const user = Object.assign({}, u);
            if (user.role === 'superadmin' || (user.username || '').toLowerCase() === 'superadmin') {
                user.must_change_pwd = 0;
                user.initial_password = '';
                user.phone = user.phone || '';
                return user;
            }
            if (!('initial_password' in user) || !user.initial_password) {
                user.initial_password = DEFAULT_INITIAL_PASSWORD;
            }
            if (!('phone' in user)) {
                user.phone = '';
            }
            if (!('must_change_pwd' in user)) {
                const usesDefaultPwd = user.password === DEFAULT_INITIAL_PASSWORD;
                user.must_change_pwd = usesDefaultPwd ? 1 : 1; // 老数据一律要求先改密一次，以保证"绑定手机"
            }
            if (user.password === (user.initial_password || DEFAULT_INITIAL_PASSWORD)) {
                user.must_change_pwd = 1;
            }
            return user;
        }

        // 判断用户是否需要在登录后强制改密
        function needsPasswordChange(user) {
            if (!user) return false;
            if (user.role === 'superadmin' || (user.username || '').toLowerCase() === 'superadmin') return false;
            const normalized = normalizeUserForLogin(user);
            if (normalized.must_change_pwd && Number(normalized.must_change_pwd) === 1) return true;
            if (normalized.password === (normalized.initial_password || DEFAULT_INITIAL_PASSWORD)) return true;
            if (!normalized.phone) return true; // 未绑定手机
            return false;
        }

        // 校验手机号（中国大陆 11 位手机号格式）
        function isValidChinaMobile(phone) {
            if (!phone) return false;
            return /^1[3-9]\d{9}$/.test(String(phone).trim());
        }

        // 通用：登录成功后的统一后处理
        // 返回 Promise<{ proceedToMainLayout: true/false }> - 如果触发改密模态，改密成功才会 resolve(true)
        async function afterLoginRoutine(rawUser, credentialHint) {
            // 保存凭证（可选；微信/指纹登录不保存）
            if (credentialHint && typeof credentialHint === 'object') {
                const { username, password, saveUsername, savePassword } = credentialHint;
                if (typeof saveUsername !== 'undefined') {
                    if (saveUsername) localStorage.setItem('savedUsername', username || '');
                    else localStorage.removeItem('savedUsername');
                }
                if (typeof savePassword !== 'undefined') {
                    if (savePassword) localStorage.setItem('savedPassword', password || '');
                    else localStorage.removeItem('savedPassword');
                }
                if (typeof saveUsername !== 'undefined') {
                    localStorage.setItem('saveUsername', saveUsername ? 'true' : 'false');
                }
                if (typeof savePassword !== 'undefined') {

        // 简易 SHA1（用于 mock 令牌生成；不依赖外部库）
        const BufferMock_SHA1 = (function() {
            function toHex(n) { return (n >>> 0).toString(16).padStart(8, '0'); }
            function sha1(str) {
                const utf8 = unescape(encodeURIComponent(str));
                let len = utf8.length, words = [];
                for (let i = 0; i < len; i += 4) {
                    words[i >>> 2] |= (utf8.charCodeAt(i) << 24) | (utf8.charCodeAt(i+1) << 16) | (utf8.charCodeAt(i+2) << 8) | utf8.charCodeAt(i+3);
                }
                words[len >>> 2] |= (0x80 << ((3 - (len % 4)) * 8));
                words[(((len + 8) >>> 6) << 4) + 15] = len * 8;
                let w = Array(80), a=0x67452301, b=0xefcdab89, c=0x98badcfe, d=0x10325476, e=0xc3d2e1f0;
                for (let s = 0; s < words.length; s += 16) {
                    const H0=a, H1=b, H2=c, H3=d, H4=e;
                    for (let i = 0; i < 80; i++) {
                        if (i < 16) w[i] = words[s+i] | 0;
                        else w[i] = (w[i-3] ^ w[i-8] ^ w[i-14] ^ w[i-16]);
                        w[i] = (w[i] << 1) | (w[i] >>> 31);
                        let f, k;
                        if (i < 20) { f = (b & c) | (~b & d); k = 0x5a827999; }
                        else if (i < 40) { f = b ^ c ^ d; k = 0x6ed9eba1; }
                        else if (i < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8f1bbcdc; }
                        else { f = b ^ c ^ d; k = 0xca62c1d6; }
                        const temp = (((a << 5) | (a >>> 27)) + f + e + k + w[i]) | 0;
                        e = d; d = c; c = (b << 30) | (b >>> 2); b = a; a = temp;
                    }
                    a = (a + H0) | 0; b = (b + H1) | 0; c = (c + H2) | 0; d = (d + H3) | 0; e = (e + H4) | 0;
                }
                return toHex(a) + toHex(b) + toHex(c) + toHex(d) + toHex(e);
            }
            return sha1;
        })();

        // ===== 报表 API 适配器 =====
        async function reportsApi(path, params) {
            let url = `${API_BASE}/api/reports${path}`;
            if (params) {
                const qs = [];
                for (const k in params) {
                    if (params[k] !== undefined && params[k] !== null && params[k] !== '') {
                        qs.push(`${k}=${encodeURIComponent(params[k])}`);
                    }
                }
                if (qs.length) url += '?' + qs.join('&');
            }
            try {
                const res = await fetch(url);
                const json = await res.json();
                if (!json.success) throw new Error(json.message || 'API error');
                return json.data;
            } catch (err) {
                console.error('报表API请求失败:', path, err.message);
                throw err;
            }
        }

        // ===== 结算 API 适配器 =====
        async function settlementsApi(action, params) {
            let url, options = {};
            switch (action) {
                case 'getByOrder':
                    url = `${API_BASE}/api/settlements/${params}`;
                    break;
                case 'save':
                    url = `${API_BASE}/api/settlements`;
                    options.method = 'POST';
                    options.headers = { 'Content-Type': 'application/json' };
                    options.body = JSON.stringify(params);
                    break;
                case 'delete':
                    url = `${API_BASE}/api/settlements/${params}`;
                    options.method = 'DELETE';
                    break;
                default:
                    throw new Error('Unknown settlements API action: ' + action);
            }
            try {
                const res = await fetch(url, options);
                const json = await res.json();
                if (!json.success) throw new Error(json.message || 'API error');
                return json.data;
            } catch (err) {
                console.error('结算API请求失败:', action, err.message);
                throw err;
            }
        }

        function dbGet(storeName, key) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(storeName, 'readonly');
                const store = transaction.objectStore(storeName);
                const request = key ? store.get(key) : store.getAll();
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
            });
        }

        function dbPut(storeName, value) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(storeName, 'readwrite');
                const store = transaction.objectStore(storeName);
                const request = store.put(value);
                let _lastID = undefined;
                request.onsuccess = () => { _lastID = request.result; };
                request.onerror = (e) => { e.preventDefault(); reject(request.error); };
                transaction.oncomplete = () => {
                    if (_lastID === undefined) {
                        // 某些浏览器/Electron版本在 oncomplete 时 request.result 已失效，补从 request 读取
                        try { _lastID = request.result; } catch (e) {}
                    }
                    resolve({ lastID: _lastID, changes: 1 });
                };
                transaction.onerror = () => reject(transaction.error);
                transaction.onabort = () => reject(transaction.error || new Error('事务被中止'));
            });
        }

        function dbDelete(storeName, key) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(storeName, 'readwrite');
                const store = transaction.objectStore(storeName);
                const request = store.delete(key);
                request.onerror = () => reject(request.error);
                transaction.oncomplete = () => resolve({ changes: 1 });
                transaction.onerror = () => reject(transaction.error);
                transaction.onabort = () => reject(transaction.error || new Error('事务被中止'));
            });
        }

        function dbClear(storeName) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(storeName, 'readwrite');
                const store = transaction.objectStore(storeName);
                const request = store.clear();
                request.onerror = () => reject(request.error);
                transaction.oncomplete = () => resolve();
                transaction.onerror = () => reject(transaction.error);
                transaction.onabort = () => reject(transaction.error || new Error('事务被中止'));
            });
        }

        function dbGetByIndex(storeName, indexName, value) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(storeName, 'readonly');
                const store = transaction.objectStore(storeName);
                const index = store.index(indexName);
                const request = index.getAll(value);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
            });
        }

        async function migrateCustomersToV20() {
            try {
                const records = await dbGet('customers');
                if (records.length === 0) return;

                // 检查是否需要迁移（有没有 secondary_customers 字段）
                const needsMigration = records.some(r => !r.hasOwnProperty('secondary_customers'));
                if (!needsMigration) {
                    console.log('客户数据已是 v20 格式，跳过迁移');
                    return;
                }

                console.log('开始迁移客户数据到 v20（secondary_customers JSON 字段）...');

                // 按 company_name 分组
                const groups = {};
                for (const r of records) {
                    const cn = r.company_name || '';
                    if (!groups[cn]) groups[cn] = [];
                    groups[cn].push(r);
                }

                for (const [name, recs] of Object.entries(groups)) {
                    // 主记录：secondary_id === 0 的记录，或第一条
                    const mainRecord = recs.find(r => r.secondary_id === 0) || recs[0];
                    // 二级客户记录：secondary_id > 0
                    const secRecords = recs.filter(r => r.secondary_id > 0)
                        .sort((a, b) => (a.secondary_id || 0) - (b.secondary_id || 0));

                    // 构建 secondary_customers JSON
                    const secondaryCustomers = secRecords.map(sr => ({
                        username: sr.secondary_username || '',
                        password: sr.secondary_password || '',
                        name: sr.secondary_name || ''
                    })).filter(s => s.username);

                    // 更新主记录
                    const cleanRecord = { ...mainRecord };
                    delete cleanRecord.company_id;
                    delete cleanRecord.secondary_id;
                    delete cleanRecord.secondary_username;
                    delete cleanRecord.secondary_password;
                    delete cleanRecord.secondary_name;
                    delete cleanRecord.secondary_users;
                    cleanRecord.secondary_customers = JSON.stringify(secondaryCustomers);
                    if (!cleanRecord.status) cleanRecord.status = 'active';
                    await dbPut('customers', cleanRecord);

                    // 更新二级客户的 users 记录指向主记录
                    for (const sr of secRecords) {
                        const usersToUpdate = await dbGetByIndexSafe('users', 'customer_id', sr.id);
                        for (const u of usersToUpdate) {
                            u.customer_id = mainRecord.id;
                            if (u.role === 'customer') u.role = 'secondary_customer';
                            await dbPut('users', u);
                        }
                        // 删除旧的二级客户记录
                        await dbDelete('customers', sr.id);
                    }

                    console.log(`迁移: "${name}" → ${secondaryCustomers.length} 个二级客户`);
                }

                // 确保所有记录都有 secondary_customers 字段
                const allRecords = await dbGet('customers');
                for (const r of allRecords) {
                    if (!r.hasOwnProperty('secondary_customers')) {
                        r.secondary_customers = '[]';
                        // 清理旧字段
                        delete r.company_id;
                        delete r.secondary_id;
                        delete r.secondary_username;
                        delete r.secondary_password;
                        delete r.secondary_name;
                        delete r.secondary_users;
                        await dbPut('customers', r);
                    }
                }
                console.log('客户数据迁移 v20 完成');
            } catch (err) {
                console.error('V19→V20 迁移失败:', err);
                // 不阻塞启动，让用户手动处理
            }
        }

            }
            // 一次性后端导入：IndexedDB 客户清单为空时，尝试从后端 SQLite 拉取并写入本地
            // 这样既保留存量数据，又彻底消除运行时对 HTTP 后端的依赖
            if (!products.length) {
                try {
                    const imported = await importCustomerProductsFromBackend();
                    if (imported && imported.length) {
                        products = imported;
                        console.log(`客户清单：从后端一次性导入 ${products.length} 条记录到 IndexedDB`);
                    }
                } catch (e) {
                    console.warn('客户清单：后端一次性导入跳过（后端不可用或无数据）:', e.message);
                }
            }
            data.customerProducts = [];
            let cpNeedsUpdate = false;
            for (let i = 0; i < products.length; i++) {
                if (products[i].sort_order === undefined) {
                    products[i].sort_order = i;
                    cpNeedsUpdate = true;
                }
            }
            if (cpNeedsUpdate) {
                for (const product of products) {
                    await dbPut('customer_products', product);
                }
            }
            for (const product of products) {
                // V26: category_name/name/size 已存储在 customer_products 表中，无需再 computed
                // cloth_name/spec_name/spec_size/customer_name 已废弃，用 name/size/product_name 替代
                if (!product.category_name) {
                    const nameObj = data.clothNames.find(n => n.id === product.cloth_name_id || n.id === product.spec_id);
                    if (nameObj) {

                    const name = data.clothNames.find(n => n.id === item.spec_id);
                    item.cloth_name = cloth ? cloth.name : '';
                    item.spec_name = name ? name.spec : '';

            const records = await dbGet('daily_records');

                const product = data.customerProducts.find(p => p.id === record.product_id);
                if (product) {
                    // V25: 优先用 product_name

                    if (record.spec_id && data.clothNames) {
                        const cn = data.clothNames.find(n => n.id === record.spec_id);
                        record.spec_name = cn ? cn.spec : '';

            // 先加载工作流数据，供订单关联使用
            data.workflowSettings = await dbGet('workflow_settings') || [];
            data.customerWorkflows = await dbGet('customer_workflows') || [];

            const washOrders = await washOrdersApi('getAll');
            data.washOrders = [];
            data.washOrderItems = [];
            // 后端返回的 orders 已含 items，扁平化到 washOrderItems 供既有逻辑使用
            if (Array.isArray(washOrders)) {
                for (const o of washOrders) {
                    if (Array.isArray(o.items)) {
                        for (const it of o.items) {
                            it.order_id = o.id;
                            data.washOrderItems.push(it);
                        }
                    }
                }
            }
            data.washCompletions = await dbGet('wash_completions');
            data.washOperations = await dbGet('wash_operations');
            // 加载留言表
            data.orderMessages = {};
            try {
                const rawMessages = await dbGet('order_messages');
                if (rawMessages && rawMessages.length) {
                    for (const m of rawMessages) {
                        if (!data.orderMessages[m.order_id]) data.orderMessages[m.order_id] = [];
                        data.orderMessages[m.order_id].push(m);
                    }
                }
            } catch(e) { /* order_messages 表尚未创建，忽略 */ }

            // 列名→流程步骤关键词映射
            const STEP_KEYWORDS = {
                forecast: ['酒店预报'],
                collect: ['收洗', '收取'],
                wash: ['洗涤'],
                handover: ['送还', '交接'],
                confirm: ['酒店确认']
            };

            for (const order of washOrders) {
                const customer = data.customers.find(c => c.id === order.customer_id);
                order.customer_name = customer ? customer.short_name : '';
                if (order.secondary_customer) {
                    order.customer_display = order.customer_name + ' / ' + order.secondary_customer;
                } else {
                    order.customer_display = order.customer_name;
                }
                order.items = data.washOrderItems.filter(i => i.order_id === order.id);
                for (const item of order.items) {
                    const product = data.customerProducts.find(p => p.id === item.product_id);
                    if (product) {
                        // V25: 优先 product_name
                        item.product_name = product.product_name || product.name || product.alias || '未命名';
                        if (item.spec_id && data.clothNames) {
                            const cn = data.clothNames.find(n => n.id === item.spec_id);
                            item.spec_name = cn ? cn.spec : '';
                        }
                    }
                    item.completions = data.washCompletions.filter(c => c.order_item_id === item.id);
                }
                order.operations = data.washOperations.filter(o => o.order_id === order.id).sort((a, b) => new Date(b.operation_time) - new Date(a.operation_time));
                for (const op of order.operations) {
                    const user = data.users.find(u => u.id === op.operator_id);
                    op.operator_name = user ? user.name : '';
                }
                const forecastUser = data.users.find(u => u.id === order.forecast_user_id);
                order.forecast_user_name = forecastUser ? forecastUser.name : '';
                const forecastConfirmedBy = data.users.find(u => u.id === order.forecast_confirmed_by);
                order.forecast_confirmed_by_name = forecastConfirmedBy ? forecastConfirmedBy.name : '';
                const collectUser = data.users.find(u => u.id === order.collect_user_id);
                order.collect_user_name = collectUser ? collectUser.name : '';
                const washUser = data.users.find(u => u.id === order.wash_user_id);
                order.wash_user_name = washUser ? washUser.name : '';
                const handoverUser = data.users.find(u => u.id === order.handover_user_id);
                order.handover_user_name = handoverUser ? handoverUser.name : '';
                const handoverConfirmedBy = data.users.find(u => u.id === order.handover_confirmed_by);
                order.handover_confirmed_by_name = handoverConfirmedBy ? handoverConfirmedBy.name : '';

                // 关联客户工作流：确定哪些流程步骤对该客户启用
                order.enabled_steps = {};
                const cw = data.customerWorkflows.find(w => w.customer_id === order.customer_id);
                if (cw && cw.enabled_steps && cw.enabled_steps.length > 0) {
                    const enabledNames = cw.enabled_steps
                        .map(sid => data.workflowSettings.find(ws => ws.id === sid))
                        .filter(Boolean)
                        .map(ws => ws.step_name);
                    for (const [colKey, keywords] of Object.entries(STEP_KEYWORDS)) {
                        order.enabled_steps[colKey] = enabledNames.some(name =>
                            keywords.some(kw => name.includes(kw))
                        );
                    }
                }
                // 无工作流配置时，默认所有步骤都启用
                if (Object.keys(order.enabled_steps).length === 0) {
                    for (const key of Object.keys(STEP_KEYWORDS)) {
                        order.enabled_steps[key] = true;
                    }
                }

                data.washOrders.push(order);
            }
            data.workflowConfigs = await dbGet('workflow_configs');
            data.orderItemChanges = await dbGet('order_item_changes');
            data.clothCategories = await dbGet('cloth_categories') || [];
            data.companyInfo = (await dbGet('company_info') || [])[0] || null;
        }

        // 根据当前用户的角色和已保存的权限授权，计算可访问的页面 key 集合
        function getAccessiblePageKeys() {
            if (!currentUser) return new Set();
            // 超级管理员：全部菜单（含所有子页面）
            if (currentUser.role === 'superadmin') {
                const all = new Set(ROLES.admin);
                Object.values(PERMISSION_MENU_TREE).forEach(arr => arr.forEach(k => all.add(k)));
                return all;
            }

            // 确定用户类型和角色 key
            let userType = 'company';
            let roleKey = currentUser.role;
            if (currentUser.role === 'customer') {
                userType = 'customer';
                roleKey = currentUser.perm_role || '';
            }

            try {
                const grants = (roleKey ? loadGrants(userType, roleKey) : []) || [];
                // 无已保存授权 → 仅保留 welcome 作为落地页（无权限的菜单全部隐藏）
                if (grants.length === 0) return new Set(['welcome']);

                // 构建权限树并应用授权，计算每个节点的 checked/indeterminate 状态
                const tree = buildPermissionTreeByScan(userType);
                applyGrantsToTree(tree, grants);

                const accessible = new Set(['welcome']); // welcome 始终作为落地页
                // 判断节点是否可访问：有子节点时 checked 或 indeterminate 均算可访问；叶子节点需 checked
                function isNodeAccessible(node) {
                    if (!node) return false;
                    if (node.children && node.children.length > 0) {
                        return !!(node.checked || node.indeterminate);
                    }
                    return !!node.checked;
                }
                // 遍历顶层节点，收集可访问的页面 key（含父菜单的子页面 key）
                if (tree.children) {
                    tree.children.forEach(node => {
                        if (isNodeAccessible(node)) {
                            accessible.add(node.path);
                            if (node.children && node.children.length > 0) {
                                node.children.forEach(child => {
                                    if (isNodeAccessible(child)) {
                                        accessible.add(child.path);
                                    }
                                });
                            }
                        }
                    });
                }
                return accessible;
            } catch (e) {
                console.error('getAccessiblePageKeys 计算失败:', e, 'userType:', userType, 'roleKey:', roleKey);
                return new Set(['welcome']);
            }
        }

        function renderSidebar() {
            const nav = document.getElementById('sidebar-nav');
            const accessiblePages = getAccessiblePageKeys();
            const allPages = ROLES.admin; // 标准菜单顺序
            const parentKeys = Object.keys(PERMISSION_MENU_TREE);
            const childPageSet = new Set();
            Object.values(PERMISSION_MENU_TREE).forEach(arr => arr.forEach(k => childPageSet.add(k)));

            let html = '';

            allPages.forEach(page => {
                if (parentKeys.includes(page)) {
                    // 父菜单：只渲染有权限的子项
                    const allChildren = PERMISSION_MENU_TREE[page] || [];
                    const visibleChildren = allChildren.filter(c => accessiblePages.has(c));
                    if (visibleChildren.length === 0) return; // 无可访问子项，跳过整个父菜单

                    const isActive = visibleChildren.some(c => currentPage === c);
                    const menuId = page + '-menu';
                    const childrenHtml = visibleChildren.map(childKey =>
                        `<div class="nav-subitem ${currentPage === childKey ? 'active' : ''}" onclick="showPage('${childKey}');event.stopPropagation();">${PAGE_TITLES[childKey] || childKey}</div>`
                    ).join('');

                    html += `
                        <div class="nav-item nav-parent ${isActive ? 'active' : ''}" onclick="toggleSubmenu('${menuId}')">
                            <div><span>${PAGE_TITLES[page] || page}</span><span class="nav-arrow">▶</span></div>
                            <div class="nav-submenu ${isActive ? 'show' : ''}" id="${menuId}">
                                ${childrenHtml}
                            </div>
                        </div>
                    `;
                } else if (!childPageSet.has(page)) {
                    // 独立页面
                    if (!accessiblePages.has(page)) return;
                    html += `<div class="nav-item ${currentPage === page ? 'active' : ''}" onclick="showPage('${page}')">${PAGE_TITLES[page] || page}</div>`;
                }
            });
            nav.innerHTML = html;
        }

        function toggleSubmenu(id) {
            const menu = document.getElementById(id);
            const nav = document.getElementById('sidebar-nav');
            menu.classList.toggle('show');
            
            setTimeout(() => {
                if (menu.classList.contains('show')) {
                    const rect = menu.getBoundingClientRect();
                    const navRect = nav.getBoundingClientRect();
                    
                    const menuTop = rect.top - navRect.top + nav.scrollTop;
                    const menuBottom = menuTop + rect.height;
                    const navHeight = navRect.height;
                    
                    if (menuTop < nav.scrollTop) {
                        nav.scrollTo({ top: menuTop, behavior: 'smooth' });
                    } else if (menuBottom > nav.scrollTop + navHeight) {
                        const scrollAmount = menuBottom - navHeight;
                        nav.scrollTo({ top: scrollAmount, behavior: 'smooth' });
                    }
                }
            }, 50);
        }

        async function moveProductUp(id) {
            const products = [...data.customerProducts].sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
            const index = products.findIndex(p => p.id === id);
            if (index <= 0) return;
            
            const current = products[index];
            const prev = products[index - 1];
            
            const tempOrder = current.sort_order || 0;
            current.sort_order = prev.sort_order || 0;
            prev.sort_order = tempOrder;
            
            await dbPut('customer_products', current);
            await dbPut('customer_products', prev);
            await loadData();
            showPage('clothcustomer');
        }

        async function moveProductDown(id) {
            const products = [...data.customerProducts].sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
            const index = products.findIndex(p => p.id === id);
            if (index >= products.length - 1) return;
            
            const current = products[index];
            const next = products[index + 1];
            
            const tempOrder = current.sort_order || 0;
            current.sort_order = next.sort_order || 0;
            next.sort_order = tempOrder;
            
            await dbPut('customer_products', current);
            await dbPut('customer_products', next);
            await loadData();
            showPage('clothcustomer');
        }

        function buildProductName(nameId, specId, alias) {
            // V24/V25: cloth_names 每行 = name+spec+size
            // specId 指向 cloth_names.id（含 spec/size），nameId 可能与 specId 相同
            const specObj = data.clothNames.find(n => n.id == parseInt(specId));
            const nameObj = data.clothNames.find(n => n.id == parseInt(nameId));
            const nameText = (nameObj && nameObj.name) || (specObj && specObj.name) || '';
            const specText = specObj ? (specObj.spec || '') : '';
            const sizeText = specObj ? (specObj.size || '') : '';
            if (!nameText) return '';
            // V25: product_name = alias + name + spec + size
            let result = '';
            if (alias) result += alias + ' ';
            result += nameText;
            if (specText) result += ' ' + specText;
            if (sizeText) result += ' ' + sizeText;
            return result.trim();
        }

                        cloth_name_id: parseInt(nameId),

                        alias: alias,
                        product_name: buildProductName(nameId, specId, alias),
                        image: image,
                        note: note,
                        sort_order: existing ? existing.sort_order : data.customerProducts.length
                    };
                } else {
                    dataToSave = {
                        customer_id: customerId === 'temp' ? null : parseInt(customerId),
                        temp_customer: customerId === 'temp' ? tempCustomer : null,
                        category_name: categoryName,
                        cloth_name_id: parseInt(nameId),

                        image: image,
                        note: note,
                        sort_order: data.customerProducts.length
                    };
                }
                
                await dbPut('customer_products', dataToSave);

        }

        function moveCpRowUp(rowId) {
            const row = document.getElementById(rowId);
            const prev = row.previousElementSibling;
            if (prev && prev.classList.contains('cp-product-row')) {
                const header = row.parentNode.querySelector('.cp-product-header');
                if (header && prev === header) return;
                row.parentNode.insertBefore(row, prev);
            }
        }

            const row = document.getElementById(rowId);
            const next = row.nextElementSibling;
            if (next && next.classList.contains('cp-product-row')) {
                row.parentNode.insertBefore(next, row);
            }
        }

        async function saveCustomerProducts() {
            try {
                const customerId = document.getElementById('cp-customer').value;
                const tempCustomer = document.getElementById('cp-temp-customer').value.trim();
                const secCustomer = document.getElementById('cp-secondary-customer')?.value || '';
                
                if (!customerId && !tempCustomer) {
                    alert('请选择客户或输入临时客户名称');
                    return;
                }
                
                const rows = document.querySelectorAll('.cp-product-row');
                if (rows.length === 0) {
                    alert('请至少添加一个品名规格');
                    return;
                }
                
                let sortOrder = 0;
                
                // 先删除该客户 + 二级客户分组的所有旧产品
                const allProducts = await dbGet('customer_products');
                const isTemp = customerId === 'temp';
                const oldProducts = allProducts.filter(p => {
                    if (isTemp) return !p.customer_id && p.temp_customer === tempCustomer;
                    const matchCustomer = p.customer_id == parseInt(customerId);
                    const matchSec = (p.secondary_customer || '') === secCustomer;
                    return matchCustomer && matchSec;
                });
                for (const p of oldProducts) {
                    await dbDelete('customer_products', p.id);
                }
                
                // 再全部重新保存
                const savePromises = [];
                rows.forEach(row => {
                    const rowId = row.id;
                    const nameVal = document.getElementById(rowId + '-name').value;
                    const specId = document.getElementById(rowId + '-spec').value;
                    const alias = document.getElementById(rowId + '-alias').value.trim();
                    const isDefault = document.getElementById(rowId + '-default').checked;
                    const note = document.getElementById(rowId + '-note').value.trim();
                    const imageData = document.getElementById(rowId + '-image-data') ? document.getElementById(rowId + '-image-data').value : '';
                    const productNameInput = document.getElementById(rowId + '-product-name');
                    const productNameVal = productNameInput ? productNameInput.value.trim() : '';
                    
                    if (!nameVal) return;
                    
                    const nameObj = data.clothNames.find(n => n.name === nameVal);
                    const realCategoryId = nameObj ? nameObj.category_id : null;
                    const catObj = realCategoryId ? data.clothCategories.find(c => c.id === realCategoryId) : null;
                    const categoryName = catObj ? catObj.name : '';
                    
                    // 从 cloth_names 获取 name 和 size（denormalized 存储）
                    const specObj = (specId && specId !== 'all') ? data.clothNames.find(n => n.id == parseInt(specId)) : null;
                    const clothNameText = nameObj ? nameObj.name : '';
                    const clothSizeText = specObj ? (specObj.size || '') : '';
                    
                    // 产品名：优先使用用户编辑的值，否则自动生成
                    const autoProductName = buildProductName(nameVal, specId, alias);
                    const finalProductName = productNameVal || autoProductName;
                    
                    const dataToSave = {
                        customer_id: customerId === 'temp' ? null : parseInt(customerId),
                        temp_customer: customerId === 'temp' ? tempCustomer : null,
                        secondary_customer: customerId === 'temp' ? '' : secCustomer,
                        category_name: categoryName,
                        cloth_name_id: nameObj ? nameObj.id : null,
                        spec_id: specId === 'all' ? null : (specId ? parseInt(specId) : null),
                        name: clothNameText,
                        size: clothSizeText,
                        alias: alias,
                        product_name: finalProductName,
                        image: imageData || null,
                        is_default: isDefault,
                        note: note,
                        sort_order: sortOrder++
                    };
                    
                    savePromises.push(dbPut('customer_products', dataToSave));
                });
                
                await Promise.all(savePromises);
                await loadData();
                showPage('clothcustomer');
                closeModal();
            } catch (e) {
                console.error('保存客户产品失败:', e);
                alert('保存客户产品失败: ' + e.message);
            }
        }

        async function saveName() {
            try {
                const idInput = document.getElementById('name-id');
                const id = idInput ? idInput.value : null;
                const name = document.getElementById('name-name').value.trim();
                const category_id = document.getElementById('name-category').value;

                if (!name) {
                    alert('请输入品名');
                    return;
                }
                if (!category_id) {
                    alert('请选择所属分类');
                    return;
                }

                // 处理图片：新上传的优先，否则保留已有
                let image = null;
                const existingImg = document.getElementById('name-existing-image');
                const imgInput = document.getElementById('name-image');
                if (imgInput && imgInput.files && imgInput.files.length > 0) {
                    image = await nameImageToDataURL(imgInput.files[0]);
                } else if (existingImg) {
                    image = existingImg.value || '';
                }

                if (id) {
                    // ===== 编辑模式：只更新当前一条 =====
                    const existing = data.clothNames.find(n => n.id === parseInt(id));
                    const nameData = {
                        id: parseInt(id),
                        name: name,
                        spec: document.getElementById('name-spec').value.trim(),
                        size: document.getElementById('name-size').value.trim(),
                        category_id: parseInt(category_id),
                        note: document.getElementById('name-note').value.trim(),
                        image: image,
                        sort_order: existing ? existing.sort_order : data.clothNames.length
                    };
                    await dbPut('cloth_names', nameData);
                } else {
                    // ===== 添加模式：批量创建多个规格 =====
                    const specRows = document.querySelectorAll('#spec-rows-container .spec-row');
                    const specs = [];
                    specRows.forEach(row => {
                        const spec = (row.querySelector('.spec-input') || {}).value || '';
                        const size = (row.querySelector('.size-input') || {}).value || '';
                        const note = (row.querySelector('.note-input') || {}).value || '';
                        // 至少规格/尺寸/备注有一个非空才创建
                        if (spec.trim() || size.trim() || note.trim()) {
                            specs.push({ spec: spec.trim(), size: size.trim(), note: note.trim() });
                        }
                    });
                    // 如果所有行都为空，创建一条空规格记录（兼容旧行为）
                    if (specs.length === 0) {
                        specs.push({ spec: '', size: '', note: '' });
                    }
                    let baseSortOrder = data.clothNames.length;
                    for (const s of specs) {
                        await dbPut('cloth_names', {
                            name: name,
                            spec: s.spec,
                            size: s.size,
                            category_id: parseInt(category_id),
                            note: s.note,
                            image: image,
                            sort_order: baseSortOrder++
                        });
                    }
                }

                await loadData();
                closeModal();
                showPage('clothname');
            } catch (e) {
                console.error('保存品名失败:', e);
                alert('保存品名失败: ' + e.message);
            }
        }

        async function moveNameUp(id) {
            const names = [...data.clothNames].sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
            const index = names.findIndex(n => n.id === id);
            if (index <= 0) return;
            
            const current = names[index];
            const prev = names[index - 1];
            
            const tempOrder = current.sort_order || 0;
            current.sort_order = prev.sort_order || 0;
            prev.sort_order = tempOrder;
            
            await dbPut('cloth_names', current);
            await dbPut('cloth_names', prev);
            await loadData();
            showPage('clothname');
        }

        async function moveNameDown(id) {
            const names = [...data.clothNames].sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
            const index = names.findIndex(n => n.id === id);
            if (index >= names.length - 1) return;
            
            const current = names[index];
            const next = names[index + 1];
            
            const tempOrder = current.sort_order || 0;
            current.sort_order = next.sort_order || 0;
            next.sort_order = tempOrder;
            
            await dbPut('cloth_names', current);
            await dbPut('cloth_names', next);
            await loadData();
            showPage('clothname');
        }

        // ====== 品名图片处理 ======
        function handleNameImageUpload(input) {
            const file = input.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxSize = 200;
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > height) {
                        if (width > maxSize) {
                            height *= maxSize / width;
                            width = maxSize;
                        }
                    } else {
                        if (height > maxSize) {
                            width *= maxSize / height;
                            height = maxSize;
                        }
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const thumbnail = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('name-image-preview').innerHTML = '<img src="' + thumbnail + '" style="max-width:120px;max-height:120px;border-radius:4px;">';
                    input.dataset.preview = thumbnail;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function nameImageToDataURL(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const maxSize = 200;
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxSize) { height *= maxSize / width; width = maxSize; }
                        } else {
                            if (height > maxSize) { width *= maxSize / height; height = maxSize; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function saveCompanyInfo() {
            const getName = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };

            const companyName = getName('ci-company-name');
            if (!companyName) {
                alert('请填写公司名称');
                document.getElementById('ci-company-name')?.focus();
                return;
            }

            // 收集银行账户
            const bankAccounts = [];
            document.querySelectorAll('#ci-bank-list .ci-bank-row').forEach(row => {
                const bank_name = row.querySelector('.ci-bank-name')?.value.trim() || '';
                const account_number = row.querySelector('.ci-bank-number')?.value.trim() || '';
                const account_name = row.querySelector('.ci-bank-account-name')?.value.trim() || '';
                if (bank_name || account_number || account_name) {
                    bankAccounts.push({ bank_name, account_number, account_name });
                }
            });

            const info = {
                id: 1,
                company_name: companyName,
                short_name: getName('ci-short-name'),
                company_type: getName('ci-company-type'),
                credit_code: getName('ci-credit-code'),
                registered_capital: getName('ci-registered-capital'),
                establishment_date: getName('ci-establishment-date'),
                legal_person: getName('ci-legal-person'),
                registered_address: getName('ci-registered-address'),
                business_scope: getName('ci-business-scope'),
                business_term: getName('ci-business-term'),
                bank_accounts: JSON.stringify(bankAccounts),
                contact_person: getName('ci-contact-person'),
                phone: getName('ci-phone'),
                email: getName('ci-email'),
                office_address: getName('ci-office-address'),
                tax_number: getName('ci-tax-number'),
                invoice_title: getName('ci-invoice-title'),
                bank_code: getName('ci-bank-code')
            };

            try {
                await dbPut('company_info', info);
                data.companyInfo = info;
                alert('公司信息已保存');
            } catch (err) {
                console.error('保存公司信息失败:', err);
                alert('保存失败: ' + err.message);
            }
        }

        function autoSaveDraft() {
            const text = document.getElementById('system-info-text').value;
            localStorage.setItem('systemInfoDraft', text);
            if (systemInfoHistory.length === 0) {
                initSystemInfoHistory();
            }
            clearTimeout(systemInfoTypingTimer);
            systemInfoTypingTimer = setTimeout(function() {
                if (text !== systemInfoHistory[systemInfoHistoryIndex]) {
                    systemInfoHistory = systemInfoHistory.slice(0, systemInfoHistoryIndex + 1);
                    systemInfoHistory.push(text);
                    systemInfoHistoryIndex++;
                    if (systemInfoHistory.length > 50) {
                        systemInfoHistory.shift();
                        systemInfoHistoryIndex--;
                    }
                }
            }, 500);
        }

        function undoSystemInfo() {
            if (systemInfoHistory.length === 0) {
                initSystemInfoHistory();
            }
            if (systemInfoHistoryIndex > 0) {
                systemInfoHistoryIndex--;
                const text = systemInfoHistory[systemInfoHistoryIndex];
                document.getElementById('system-info-text').value = text;
                localStorage.setItem('systemInfoDraft', text);
                syncSysInfoMainToFloating();
            }
        }

        function redoSystemInfo() {
            if (systemInfoHistory.length === 0) {
                initSystemInfoHistory();
            }
            if (systemInfoHistoryIndex < systemInfoHistory.length - 1) {
                systemInfoHistoryIndex++;
                const text = systemInfoHistory[systemInfoHistoryIndex];
                document.getElementById('system-info-text').value = text;
                localStorage.setItem('systemInfoDraft', text);
                syncSysInfoMainToFloating();
            }
        }

        // ====== 系统说明浮动弹窗 ======
        let fsiDragging = false, fsiDragX = 0, fsiDragY = 0, fsiStartLeft = 0, fsiStartTop = 0;
        let fsiIsMinimized = false;
        let fsiIsMaximized = false;
        let fsiPreMaxState = { left: '', top: '', width: '', height: '' };
        let fsiSyncTimeout = null;
        // 调整大小相关
        let fsiResizing = false, fsiResizeDir = '';
        let fsiResizeStartW = 0, fsiResizeStartH = 0, fsiResizeStartX = 0, fsiResizeStartY = 0;
        let fsiResizeStartLeft = 0, fsiResizeStartTop = 0;

        function initFloatingSysInfoDrag() {
            const header = document.getElementById('fsi-header');
            if (!header) return;
            header.onmousedown = function(e) {
                if (e.target.tagName === 'BUTTON') return;
                if (fsiIsMaximized) return; // 最大化时不可拖拽
                fsiDragging = true;
                fsiDragX = e.clientX;
                fsiDragY = e.clientY;
                const panel = document.getElementById('floating-sysinfo');
                const rect = panel.getBoundingClientRect();
                fsiStartLeft = rect.left;
                fsiStartTop = rect.top;
                panel.style.transform = 'none';
                panel.style.left = fsiStartLeft + 'px';
                panel.style.top = fsiStartTop + 'px';
                document.addEventListener('mousemove', onFsiDrag);
                document.addEventListener('mouseup', stopFsiDrag);
                e.preventDefault();
            };
            // 双击标题栏切换最大化/还原
            header.ondblclick = function(e) {
                if (e.target.tagName === 'BUTTON') return;
                toggleMaximizeSysInfo();
            };
        }

        function onFsiDrag(e) {
            if (!fsiDragging) return;
            const panel = document.getElementById('floating-sysinfo');
            const newLeft = fsiStartLeft + (e.clientX - fsiDragX);
            const newTop = Math.max(0, fsiStartTop + (e.clientY - fsiDragY));
            panel.style.left = newLeft + 'px';
            panel.style.top = newTop + 'px';
        }

        function stopFsiDrag() {
            fsiDragging = false;
            document.removeEventListener('mousemove', onFsiDrag);
            document.removeEventListener('mouseup', stopFsiDrag);
        }

        function openFloatingSysInfo() {
            const panel = document.getElementById('floating-sysinfo');
            // 如果最大化状态，先还原
            if (fsiIsMaximized) {
                panel.classList.remove('maximized');
                panel.style.left = fsiPreMaxState.left;
                panel.style.top = fsiPreMaxState.top;
                panel.style.width = fsiPreMaxState.width;
                panel.style.height = fsiPreMaxState.height;
                panel.style.transform = '';
                document.getElementById('fsi-max-btn').textContent = '□';
                document.getElementById('fsi-max-btn').title = '最大化';
                fsiIsMaximized = false;
            }
            if (panel.classList.contains('minimized')) {
                panel.classList.remove('minimized');
                document.getElementById('fsi-min-btn').textContent = '—';
                fsiIsMinimized = false;
            }
            // 读取最新内容
            const mainText = document.getElementById('system-info-text');
            const currentContent = mainText ? mainText.value : (localStorage.getItem('systemInfoDraft') || localStorage.getItem('systemInfo') || '');
            document.getElementById('fsi-textarea').value = currentContent;
            panel.classList.add('show');
            initFloatingSysInfoDrag();
            initFloatingSysInfoResize();
            document.getElementById('fsi-sync-status').textContent = '✅ 已同步';
        }

        function closeFloatingSysInfo() {
            const panel = document.getElementById('floating-sysinfo');
            panel.classList.remove('show', 'minimized', 'maximized');
            panel.style.transform = '';
            fsiIsMinimized = false;
            fsiIsMaximized = false;
            document.getElementById('fsi-max-btn').textContent = '□';
            document.getElementById('fsi-max-btn').title = '最大化';
        }

        function toggleMinimizeSysInfo() {
            const panel = document.getElementById('floating-sysinfo');
            const btn = document.getElementById('fsi-min-btn');
            if (fsiIsMinimized) {
                panel.classList.remove('minimized');
                btn.textContent = '—';
                fsiIsMinimized = false;
                // 恢复内容同步
                syncSysInfoMainToFloating();
            } else {
                // 最小化前先退出最大化
                if (fsiIsMaximized) {
                    panel.classList.remove('maximized');
                    panel.style.left = fsiPreMaxState.left;
                    panel.style.top = fsiPreMaxState.top;
                    panel.style.width = fsiPreMaxState.width;
                    panel.style.height = fsiPreMaxState.height;
                    panel.style.transform = '';
                    document.getElementById('fsi-max-btn').textContent = '□';
                    document.getElementById('fsi-max-btn').title = '最大化';
                    fsiIsMaximized = false;
                }
                panel.classList.add('minimized');
                btn.textContent = '□';
                fsiIsMinimized = true;
            }
        }

        // ====== 最大化/还原 ======
        function toggleMaximizeSysInfo() {
            const panel = document.getElementById('floating-sysinfo');
            const btn = document.getElementById('fsi-max-btn');
            if (fsiIsMinimized) {
                // 如果最小化了，先还原
                toggleMinimizeSysInfo();
            }
            if (fsiIsMaximized) {
                // 还原
                panel.classList.remove('maximized');
                panel.style.left = fsiPreMaxState.left;
                panel.style.top = fsiPreMaxState.top;
                panel.style.width = fsiPreMaxState.width;
                panel.style.height = fsiPreMaxState.height;
                panel.style.transform = '';
                btn.textContent = '□';
                btn.title = '最大化';
                fsiIsMaximized = false;
            } else {
                // 存储当前状态
                const rect = panel.getBoundingClientRect();
                fsiPreMaxState = {
                    left: panel.style.left || rect.left + 'px',
                    top: panel.style.top || rect.top + 'px',
                    width: panel.style.width || rect.width + 'px',
                    height: panel.style.height || rect.height + 'px'
                };
                panel.classList.add('maximized');
                btn.textContent = '⛶';
                btn.title = '还原';
                fsiIsMaximized = true;
            }
        }

        // ====== 边缘拖拽调整大小 ======
        function initFloatingSysInfoResize() {
            const panel = document.getElementById('floating-sysinfo');
            const handles = {
                'fsi-resize-r': 'e',
                'fsi-resize-l': 'w',
                'fsi-resize-b': 's',
                'fsi-resize-br': 'se',
                'fsi-resize-bl': 'sw'
            };
            Object.entries(handles).forEach(([id, dir]) => {
                const el = document.getElementById(id);
                if (!el) return;
                el.onmousedown = function(e) {
                    e.stopPropagation();
                    e.preventDefault();
                    fsiResizing = true;
                    fsiResizeDir = dir;
                    fsiResizeStartX = e.clientX;
                    fsiResizeStartY = e.clientY;
                    const rect = panel.getBoundingClientRect();
                    fsiResizeStartW = rect.width;
                    fsiResizeStartH = rect.height;
                    fsiResizeStartLeft = rect.left;
                    fsiResizeStartTop = rect.top;
                    document.addEventListener('mousemove', onFsiResize);
                    document.addEventListener('mouseup', stopFsiResize);
                };
            });
        }

        function onFsiResize(e) {
            if (!fsiResizing) return;
            const panel = document.getElementById('floating-sysinfo');
            const dx = e.clientX - fsiResizeStartX;
            const dy = e.clientY - fsiResizeStartY;
            const minW = 380, minH = 250;

            if (fsiResizeDir.indexOf('e') >= 0) {
                const newW = Math.max(minW, fsiResizeStartW + dx);
                panel.style.width = newW + 'px';
            }
            if (fsiResizeDir.indexOf('w') >= 0) {
                const maxLeft = fsiResizeStartLeft + fsiResizeStartW - minW;
                const newLeft = Math.min(maxLeft, fsiResizeStartLeft + dx);
                const newW = Math.max(minW, fsiResizeStartW - (newLeft - fsiResizeStartLeft));
                panel.style.left = newLeft + 'px';
                panel.style.width = newW + 'px';
            }
            if (fsiResizeDir.indexOf('s') >= 0) {
                const newH = Math.max(minH, fsiResizeStartH + dy);
                panel.style.height = newH + 'px';
            }
        }

        function stopFsiResize() {
            fsiResizing = false;
            document.removeEventListener('mousemove', onFsiResize);
            document.removeEventListener('mouseup', stopFsiResize);
        }

        async function saveWfStep() {
            const editId = document.getElementById('wf-edit-id').value;
            const stepOrder = parseInt(document.getElementById('wf-step-order').value);
            const stepName = document.getElementById('wf-step-name').value.trim();
            const hasSub = document.getElementById('wf-has-sub').checked;
            
            if (!stepOrder || stepOrder < 1) { alert('请输入有效的步骤顺序（从1开始）'); return; }
            if (!stepName) { alert('请输入流程名称'); return; }
            
            let subSteps = [];
            if (hasSub) {
                const subOrder = parseInt(document.getElementById('wf-sub-order').value);
                const subName = document.getElementById('wf-sub-name').value.trim();
                if (!subOrder || subOrder < 1) { alert('请输入有效的二级顺序'); return; }
                if (!subName) { alert('请输入二级流程名称'); return; }
                subSteps = [{ sub_order: subOrder, sub_name: subName }];
            }
            
            const settings = data.workflowSettings || [];
            
            if (editId) {
                // 编辑模式
                const step = settings.find(s => s.id == editId);
                if (!step) return;
                const oldOrder = step.step_order;
                step.step_name = stepName;
                step.has_sub = hasSub;
                if (hasSub && subSteps.length > 0) {
                    // 处理二级流程的顺延
                    const existingSubs = (step.sub_steps || []).sort((a, b) => a.sub_order - b.sub_order);
                    const existingSub = existingSubs.find(s => s.sub_order === subSteps[0].sub_order);
                    if (!existingSub) {
                        step.sub_steps = reorderSubSteps(existingSubs, subSteps[0].sub_order);
                        const idx = step.sub_steps.findIndex(s => s.sub_order === subSteps[0].sub_order);
                        if (idx >= 0) step.sub_steps[idx] = subSteps[0];
                    } else {
                        existingSub.sub_name = subSteps[0].sub_name;
                        step.sub_steps = existingSubs;
                    }
                } else {
                    step.sub_steps = [];
                }
                if (oldOrder !== stepOrder) {
                    reorderWfSteps(settings, oldOrder, stepOrder);
                    step.step_order = stepOrder;
                    // 保存所有受影响的步骤
                    for (const s of settings) { await dbPut('workflow_settings', s); }
                } else {
                    await dbPut('workflow_settings', step);
                }
            } else {
                // 新增模式：处理顺序顺延
                const existing = settings.find(s => s.step_order === stepOrder);
                if (existing) {
                    reorderWfSteps(settings, stepOrder, settings.length + 1);
                }
                const newStep = {
                    step_order: stepOrder,
                    step_name: stepName,
                    has_sub: hasSub,
                    sub_steps: subSteps
                };
                await dbPut('workflow_settings', newStep);
            }
            
            await loadData();
            showPage('workflow');
        }

        function reorderWfSteps(steps, oldPos, newPos) {
            if (oldPos === newPos) return;
            steps.forEach(s => {
                const o = s.step_order;
                if (oldPos < newPos) {
                    if (o > oldPos && o <= newPos) s.step_order = o - 1;
                } else {
                    if (o >= newPos && o < oldPos) s.step_order = o + 1;
                }
            });
        }

        function reorderSubSteps(subs, newPos) {
            const result = [...subs];
            const maxOrder = result.length > 0 ? Math.max(...result.map(s => s.sub_order)) : 0;
            if (newPos > maxOrder) {
                result.push({ sub_order: newPos, sub_name: '' });
                return result;
            }
            result.forEach(s => {
                if (s.sub_order >= newPos) s.sub_order = s.sub_order + 1;
            });
            return result;
        }

        function editWfStep(id) {
            const step = (data.workflowSettings || []).find(s => s.id == id);
            if (!step) return;
            document.getElementById('wf-edit-id').value = step.id;
            document.getElementById('wf-step-order').value = step.step_order;
            document.getElementById('wf-step-name').value = step.step_name;
            document.getElementById('wf-has-sub').checked = !!step.has_sub;
            if (step.has_sub && step.sub_steps && step.sub_steps.length > 0) {
                document.getElementById('wf-sub-step-area').style.display = 'block';
                document.getElementById('wf-sub-order').value = step.sub_steps[0].sub_order;
                document.getElementById('wf-sub-name').value = step.sub_steps[0].sub_name;
            } else {
                document.getElementById('wf-sub-step-area').style.display = 'none';
            }
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        async function deleteWfStep(id) {
            if (!confirm('确定删除此流程步骤？')) return;
            const step = (data.workflowSettings || []).find(s => s.id == id);
            if (!step) return;
            const deletedOrder = step.step_order;
            await dbDelete('workflow_settings', id);
            const settings = data.workflowSettings || [];
            settings.forEach(s => {
                if (s.step_order > deletedOrder) s.step_order--;
            });
            for (const s of settings) { await dbPut('workflow_settings', s); }
            await loadData();
            showPage('workflow');
        }
